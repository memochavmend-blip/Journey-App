/* ── Voz / ambiente por ritual + controles del lector ── */
function vozDe(id){
  const r = (E.ajustes.ritual||{})[id];
  const v = (r && typeof r.voz === "boolean") ? r.voz : E.ajustes.voz;
  return v && Voz.soporte;
}
function ambDe(id){
  const r = (E.ajustes.ritual||{})[id];
  return (r && typeof r.amb === "boolean") ? r.amb : E.ajustes.pad;
}
function escenaActiva(tema){
  const e = E.ajustes.escena || "auto";
  if(e === "auto") return tema === "noche" ? "noche" : "vela";
  return e;
}
// Lecho de ambiente continuo en las pantallas de menú (no en la práctica).
// Idempotente: no reinicia el pad al navegar entre pantallas.
let padBed = false;
function ambienteBed(){
  const enPractica = !$("#practica").classList.contains("oculto");
  if(E.ajustes.ambienteApp && !enPractica){
    if(!Pad.activo()){ Pad.iniciar(escenaActiva("dia"), E.ajustes.padVol * 0.55); padBed = true; }
  } else if(padBed){
    Pad.detener(2); padBed = false;
  }
}
function setRitual(id, campo, val){
  E.ajustes.ritual = E.ajustes.ritual || {};
  E.ajustes.ritual[id] = Object.assign({}, E.ajustes.ritual[id], { [campo]: val });
  guardar();
}
function pintarControles(){
  const tv = $("#togVoz"), ta = $("#togAmb"), tvel = $("#togVel");
  if(!tv) return;
  tv.style.display = Voz.soporte ? "" : "none";
  tv.classList.toggle("on", !!P.vozOn);
  tv.setAttribute("aria-checked", String(!!P.vozOn));
  ta.classList.toggle("on", !!P.ambOn);
  ta.setAttribute("aria-checked", String(!!P.ambOn));
  ta.style.opacity = (P.modoAudio && !P.med) ? ".4" : "";
  tvel.textContent = String(E.ajustes.velocidad || 1) + "×";
}

/* ── Respaldo de datos ── */
function exportarDatos(){
  try{
    const blob = new Blob([JSON.stringify(E, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "practica-respaldo-" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  }catch(e){ alert("No se pudo exportar el respaldo."); }
}
function importarDatos(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const datos = JSON.parse(r.result);
      if(!datos || typeof datos !== "object") throw new Error("formato");
      E = Object.assign({}, E, datos);
      E.ajustes = Object.assign({}, E.ajustes, datos.ajustes || {});
      guardar(); aplicarTema(); cerrarHoja(); render();
      alert("Respaldo restaurado.");
    }catch(e){ alert("Ese archivo no es un respaldo válido de Práctica."); }
  };
  r.onerror = ()=>alert("No se pudo leer el archivo.");
  r.readAsText(file);
}

/* ── Ancla (salmos / grounding) ── */
let anclaI = null;
/* ════════════════ SONIDO (paisajes + Pomodoro) ════════════════ */
const SONIDOS = [
  { cat:"Relajación", escenas:[["vela","Vela"],["oceano","Océano"],["lluvia","Lluvia"],["eter","Éter"]] },
  { cat:"Concentración", escenas:[["concentracion","Enfoque"],["marron","Ruido marrón"],["blanco","Ruido blanco"]] },
  { cat:"TDAH · Atención", escenas:[["binaural","Ondas binaurales"],["marron","Ruido marrón"]], nota:"Las ondas binaurales funcionan mejor con audífonos." }
];
const SONIDO_NOMBRE = { vela:"Vela", oceano:"Océano", lluvia:"Lluvia", eter:"Éter", concentracion:"Enfoque", marron:"Ruido marrón", blanco:"Ruido blanco", binaural:"Ondas binaurales" };
let sonidoManual = null;

function reproducirSonido(escena){
  Pad.iniciar(escena, E.ajustes.padVol);
  sonidoManual = escena; padBed = true;
}
function detenerSonido(){
  Pad.detener(1.5); sonidoManual = null; padBed = false;
}

const Pomo = { activo:false, modo:"foco", finMs:0, foco:25, descanso:5, escena:"concentracion", timer:null };
function pomoRestante(){ return Pomo.activo ? Math.max(0, Math.ceil((Pomo.finMs - Date.now())/1000)) : 0; }
function pomoTexto(){
  if(!Pomo.activo) return "Listo para enfocar";
  const r = pomoRestante(), m = Math.floor(r/60), s = r % 60;
  return (Pomo.modo === "foco" ? "Enfoque" : "Descanso") + " · " + m + ":" + String(s).padStart(2,"0");
}
function pintarSonNow(){
  const now = $("#sonNow"); if(!now) return;
  now.innerHTML = estadoSonido();
  const s = $("#sonStop"); if(s) s.addEventListener("click", ()=>{ detenerSonido(); refrescarChips(); pintarSonNow(); });
}
function pintarPomo(){
  const t = $("#pomoTiempo"); if(t) t.textContent = pomoTexto();
  const b = $("#pomoBtn"); if(b) b.textContent = Pomo.activo ? "Detener" : "Iniciar enfoque";
  pintarSonNow();
}
function tickPomo(){
  try{
    if(!Pomo.activo){ return; }
    if(Date.now() >= Pomo.finMs){
      try{ Pad.campana(); }catch(e){}
      if(Pomo.modo === "foco"){ Pomo.modo = "descanso"; Pomo.finMs = Date.now() + Pomo.descanso*60000; detenerSonido(); }
      else { Pomo.modo = "foco"; Pomo.finMs = Date.now() + Pomo.foco*60000; reproducirSonido(Pomo.escena); }
      refrescarChips(); pintarPomo();
      return;
    }
    const t = $("#pomoTiempo"); if(t) t.textContent = pomoTexto();  // por tick: solo el tiempo
  }catch(e){}
}
function iniciarPomo(){
  Pomo.activo = true; Pomo.modo = "foco"; Pomo.finMs = Date.now() + Pomo.foco*60000;
  reproducirSonido(Pomo.escena);
  clearInterval(Pomo.timer); Pomo.timer = setInterval(tickPomo, 1000);
  refrescarChips(); pintarPomo();
}
function detenerPomo(){
  Pomo.activo = false; clearInterval(Pomo.timer); Pomo.timer = null;
  detenerSonido(); refrescarChips(); pintarPomo();
}
function estadoSonido(){
  if(!sonidoManual) return '';
  return '<div class="son-now"><span>Ahora suena · ' + esc(SONIDO_NOMBRE[sonidoManual] || sonidoManual) + '</span><button class="son-stop" id="sonStop">Detener</button></div>';
}
function refrescarChips(){
  document.querySelectorAll(".son-chip").forEach(ch=>ch.classList.toggle("on", ch.dataset.esc === sonidoManual));
}

function hojaSonido(){
  let cuerpo = '<div id="sonNow">' + estadoSonido() + '</div>';
  SONIDOS.forEach(c=>{
    cuerpo += '<div class="son-cat"><p class="son-cat-t">' + esc(c.cat) + '</p><div class="son-chips">' +
      c.escenas.map(e=>'<button class="son-chip'+(sonidoManual===e[0]?' on':'')+'" data-esc="'+e[0]+'">'+esc(e[1])+'</button>').join("") +
      '</div>' + (c.nota ? '<p class="campo-ayuda">'+esc(c.nota)+'</p>' : '') + '</div>';
  });
  cuerpo += '<div class="son-pomo"><p class="son-cat-t">Pomodoro · concentración por tiempo</p>' +
    '<div class="pomo-reloj" id="pomoTiempo">' + pomoTexto() + '</div>' +
    '<div class="campo"><label class="campo-et">Ciclo (min)</label><div class="segmento" id="pomoCiclo">' +
      [[25,5],[50,10],[15,3]].map(c=>'<button type="button" class="seg'+((Pomo.foco===c[0])?' activo':'')+'" data-foco="'+c[0]+'" data-desc="'+c[1]+'">'+c[0]+' / '+c[1]+'</button>').join("") +
    '</div></div>' +
    '<div class="campo"><label class="campo-et" for="pomoEsc">Sonido de enfoque</label><select class="campo-sel" id="pomoEsc">' +
      [["concentracion","Enfoque"],["marron","Ruido marrón"],["binaural","Ondas binaurales"],["blanco","Ruido blanco"]].map(e=>'<option value="'+e[0]+'"'+(Pomo.escena===e[0]?' selected':'')+'>'+e[1]+'</option>').join("") +
    '</select></div>' +
    '<div class="acciones" style="margin-top:0"><button class="accion llena" id="pomoBtn">' + (Pomo.activo ? "Detener" : "Iniciar enfoque") + '</button></div>' +
    '</div>';

  hoja("Sonido", "Paisajes para relajación, concentración y enfoque. Sigue sonando mientras usas la app.",
    cuerpo + '<div class="acciones"><button class="accion" id="sonCerrar">Cerrar</button></div>',
    ()=>{
      document.querySelectorAll(".son-chip").forEach(ch=>{
        ch.addEventListener("click", ()=>{
          if(sonidoManual === ch.dataset.esc){ detenerSonido(); }
          else { reproducirSonido(ch.dataset.esc); }
          refrescarChips(); pintarPomo();
        });
      });
      const s = $("#sonStop"); if(s) s.addEventListener("click", ()=>{ detenerSonido(); refrescarChips(); pintarPomo(); });
      document.querySelectorAll("#pomoCiclo .seg").forEach(b=>{
        b.addEventListener("click", ()=>{
          document.querySelectorAll("#pomoCiclo .seg").forEach(x=>x.classList.remove("activo"));
          b.classList.add("activo");
          Pomo.foco = +b.dataset.foco; Pomo.descanso = +b.dataset.desc;
        });
      });
      const pe = $("#pomoEsc"); if(pe) pe.addEventListener("change", ()=>{ Pomo.escena = pe.value; if(Pomo.activo && Pomo.modo === "foco") reproducirSonido(Pomo.escena); refrescarChips(); });
      $("#pomoBtn").addEventListener("click", ()=>{ if(Pomo.activo) detenerPomo(); else iniciarPomo(); });
      $("#sonCerrar").addEventListener("click", cerrarHoja);
    });
}

// Contenido = incluido + tuyo (capa de usuario).
// ── Motor de filtrado por perfil (tono → tradición) ──
function tradPermitidas(){
  const t = (E.perfil && E.perfil.tono) || "mezcla";
  if(t === "cristiano") return { cristiano:1, universal:1 };
  if(t === "espiritual") return { universal:1, budista:1 };
  return { cristiano:1, universal:1, budista:1 };
}
function esCristiano(txt){ return /ancla-ref|\bDios\b|\bSe(ñ|n)or\b|Cristo|Esp[ií]ritu Santo|Jes[uú]s/i.test(String(txt)); }
function filtraTexto(lista){
  const perm = tradPermitidas();
  const l = lista.filter(x => perm[esCristiano(x) ? "cristiano" : "universal"]);
  return l.length ? l : lista;
}
function calmaActivas(){ return filtraTexto(CALMA); }
function mensajesActivos(){ return filtraTexto(MENSAJES); }

// ── Feedback (👍/👎) → pesos por etiqueta + ocultar piezas ──
function fbPeso(tags){ return (tags||[]).reduce((s,t)=>s + (E.feedback.pesos[t]||0), 0); }
function fbOculto(id){ return E.feedback.ocultos.indexOf(id) >= 0; }
function fbGusta(id, tags){ (tags||[]).forEach(t=>{ E.feedback.pesos[t] = Math.min(8, (E.feedback.pesos[t]||0) + 1); }); guardar(); }
function fbNoGusta(id, tags){ (tags||[]).forEach(t=>{ E.feedback.pesos[t] = Math.max(-8, (E.feedback.pesos[t]||0) - 1); }); if(E.feedback.ocultos.indexOf(id) < 0) E.feedback.ocultos.push(id); guardar(); }
function fbHTML(){ return '<div class="fb"><button class="fb-btn" data-fb="up" aria-label="Me gusta"><svg viewBox="0 0 24 24"><path d="M7 21V9l4.5-7c1.3 0 2 .9 2 2.2V8h4.6c1 0 1.8.9 1.6 1.9l-1.3 6.5c-.2 1-1 1.6-1.9 1.6H7zM7 9H4v12h3"/></svg></button><button class="fb-btn fb-abajo" data-fb="down" aria-label="No es para mí"><svg viewBox="0 0 24 24"><path d="M7 21V9l4.5-7c1.3 0 2 .9 2 2.2V8h4.6c1 0 1.8.9 1.6 1.9l-1.3 6.5c-.2 1-1 1.6-1.9 1.6H7zM7 9H4v12h3"/></svg></button></div>'; }

function anclasTodas(){
  const l = filtraTexto(ANCLAS).concat((E.contenido.ancla.usuario||[]).map(u=>esc(u.texto||"")));
  const v = l.filter(a=>!fbOculto(a));
  return v.length ? v : l;
}
function salmosTodos(){
  const l = SALMOS.concat((E.contenido.salmos.usuario||[]).map(u=>esc(u.texto||"").replace(/\n/g,"<br>") + (u.ref?'<span class="ancla-ref">'+esc(u.ref)+'</span>':'')));
  const v = l.filter(s=>!fbOculto(s));
  return v.length ? v : l;
}
function historiasTodas(){
  return HISTORIAS.concat(E.contenido.historias.usuario||[]);
}
function doctrinaTodas(){
  const perm = tradPermitidas();
  let base = DOCTRINA.filter(d => perm[esCristiano(d.e) ? "cristiano" : "universal"]);
  if(!base.length) base = DOCTRINA;
  return base.concat((E.contenido.doctrina.usuario||[]).map(u=>({ t:u.t||"", e:(u.texto||"").split("\n").filter(p=>p.trim()).map(p=>'<p>'+esc(p)+'</p>').join("") })));
}
function histTemasActivos(){
  const perm = tradPermitidas();
  const tradDe = { amor:"universal", abundancia:"universal", biblia:"cristiano", budismo:"budista" };
  const l = HIST_TEMAS.filter(t => perm[tradDe[t[0]] || "universal"]);
  return l.length ? l : HIST_TEMAS;
}
function afirmacionesActivas(){
  const sel = (E.perfil.sub && E.perfil.sub.afirmaciones) || [];
  let l = sel.length ? AFIRMACIONES.filter(a=>sel.indexOf(a.t)>=0) : AFIRMACIONES.slice();
  l = l.filter(a=>!fbOculto(a.x));
  if(!l.length) l = AFIRMACIONES.filter(a=>!fbOculto(a.x));
  if(!l.length) l = AFIRMACIONES.slice();
  return l.sort((a,b)=>(fbPeso([b.t]) + Math.random()*0.7) - (fbPeso([a.t]) + Math.random()*0.7));
}
function manifestacionesActivas(){
  const sel = (E.perfil.sub && E.perfil.sub.manifestacion) || [];
  let l = sel.length ? MANIFESTACIONES.filter(m=>sel.indexOf(m.t)>=0) : MANIFESTACIONES.slice();
  l = l.filter(m=>!fbOculto(m.x));
  if(!l.length) l = MANIFESTACIONES.filter(m=>!fbOculto(m.x));
  if(!l.length) l = MANIFESTACIONES.slice();
  return l.sort((a,b)=>(fbPeso([b.t]) + Math.random()*0.7) - (fbPeso([a.t]) + Math.random()*0.7));
}

function edCampos(tipo, it){

  if(tipo === "doctrina")
    return '<input class="campo-in ed-in" id="edTitulo" placeholder="Título" value="'+esc(it.t||"")+'">' +
      '<textarea class="campo-area" id="edTexto" rows="7" placeholder="El texto. Deja una línea en blanco para separar párrafos.">'+esc(it.texto||"")+'</textarea>';
  if(tipo === "historias")
    return '<select class="campo-sel ed-in" id="edTema">'+HIST_TEMAS.map(t=>'<option value="'+t[0]+'"'+((it.tema||"amor")===t[0]?' selected':'')+'>'+t[1]+'</option>').join("")+'</select>' +
      '<input class="campo-in ed-in" id="edTitulo" placeholder="Título" value="'+esc(it.titulo||"")+'">' +
      '<textarea class="campo-area" id="edTexto" rows="7" placeholder="La historia…">'+esc(it.texto||"")+'</textarea>';
  return '';
}
function edLeerForm(tipo){
  const t = (($("#edTexto")||{}).value||"").trim();
  if(!t) return null;
  if(tipo === "ancla") return { texto:t };
  if(tipo === "salmos") return { texto:t, ref:(($("#edRef")||{}).value||"").trim() };
  if(tipo === "doctrina") return { t:(($("#edTitulo")||{}).value||"").trim()||"Sin título", texto:t };
  if(tipo === "historias") return { tema:(($("#edTema")||{}).value)||"amor", titulo:(($("#edTitulo")||{}).value||"").trim()||"Sin título", texto:t };
  return null;
}
function edTituloItem(tipo, it){
  if(tipo === "ancla" || tipo === "salmos"){ const x = (it.texto||"").replace(/\n/g," "); return x.slice(0,64) + (x.length>64?"…":""); }
  return it.titulo || it.t || "Sin título";
}
function renderEditor(){
  const cont = $("#edCont"); if(!cont) return;
  const lista = E.contenido[edTipo].usuario || [];
  let h = "";
  if(lista.length){
    h += '<div class="ed-lista">' + lista.map(it=>
      '<div class="ed-item"><button class="ed-item-t" data-ed-edit="'+it.id+'">'+esc(edTituloItem(edTipo, it))+'</button><button class="ed-item-x" data-ed-del="'+it.id+'" aria-label="Borrar">✕</button></div>'
    ).join("") + '</div>';
  } else {
    h += '<p class="ed-vacio">Todavía no has creado nada aquí. Lo que agregues aparece junto al contenido incluido, en su sección.</p>';
  }
  const editItem = edEditando !== null ? lista.find(x=>String(x.id)===String(edEditando)) : null;
  h += '<div class="ed-form"><p class="ed-form-t">'+(editItem?"Editar":"Añadir nuevo")+'</p>' + edCampos(edTipo, editItem) +
    '<div class="acciones" style="margin-top:2px"><button class="accion llena" id="edGuardar">'+(editItem?"Guardar cambios":"Añadir")+'</button>' +
    (editItem?'<button class="accion" id="edCancelar">Cancelar</button>':'') + '</div></div>';
  cont.innerHTML = h;
  document.querySelectorAll("#edCont [data-ed-edit]").forEach(b=>b.addEventListener("click", ()=>{ edEditando = b.dataset.edEdit; renderEditor(); }));
  document.querySelectorAll("#edCont [data-ed-del]").forEach(b=>b.addEventListener("click", ()=>{
    const id = b.dataset.edDel;
    E.contenido[edTipo].usuario = (E.contenido[edTipo].usuario||[]).filter(x=>String(x.id)!==String(id));
    if(String(edEditando)===String(id)) edEditando = null;
    guardar(); renderEditor();
  }));
  $("#edGuardar").addEventListener("click", ()=>{
    const datos = edLeerForm(edTipo);
    if(!datos){ const ta = $("#edTexto"); if(ta){ ta.style.borderColor = "var(--brasa)"; ta.focus(); } return; }
    if(editItem){ Object.assign(editItem, datos); }
    else { datos.id = Date.now(); (E.contenido[edTipo].usuario = E.contenido[edTipo].usuario||[]).push(datos); }
    edEditando = null; guardar(); renderEditor();
  });
  const c = $("#edCancelar"); if(c) c.addEventListener("click", ()=>{ edEditando = null; renderEditor(); });
}

function icono(px){
  try{
    const c = document.createElement("canvas"); c.width = c.height = px;
    const x = c.getContext("2d");
    x.fillStyle = "#0B0A09"; x.fillRect(0,0,px,px);
    const cx = px/2, base = px*.78, ancho = px*.085;
    x.fillStyle = "#DCCFAF"; x.fillRect(cx-ancho/2, px*.42, ancho, base-px*.42);
    const g = x.createRadialGradient(cx, px*.34, 0, cx, px*.34, px*.2);
    g.addColorStop(0,"#FFF3D4"); g.addColorStop(.35,"#F0A63C"); g.addColorStop(1,"rgba(240,166,60,0)");
    x.fillStyle = g; x.beginPath(); x.arc(cx, px*.34, px*.2, 0, Math.PI*2); x.fill();
    return c.toDataURL("image/png");
  }catch(e){ return null; }
}

    const l = document.createElement("link"); l.rel = "manifest";
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type:"application/manifest+json"}));
    document.head.appendChild(l);
    const t = document.createElement("link"); t.rel = "apple-touch-icon"; t.href = i192; document.head.appendChild(t);
  }
}catch(e){}

function onbRender(){

function onbSig(){
  if(onbSeq[onbIdx] === "categorias"){ const pos = onbIdx; onbSeq = onbConstruirSeq(); onbIdx = pos; }

  onbRender();
}
function onbAtras(){ if(onbIdx > 0){ onbIdx--; onbRender(); } }

  const mensaje = "«" + txt + "»\n\n— vía " + APP_NOMBRE;
  if(navigator.share){
    navigator.share({ title: APP_NOMBRE, text: mensaje, url: APP_URL }).catch(()=>{});
  } else {
    try{
      navigator.clipboard.writeText(mensaje + "\n" + APP_URL);
      const b = $("#hoyShare"); if(b){ const o = b.innerHTML; b.textContent = "Copiado"; setTimeout(()=>{ b.innerHTML = o; }, 1600); }
    }catch(e){}
  }
}
let recNotif = {};
function chequearRecordatorios(){
  const r = E.ajustes.recordatorios;
  if(!r || !r.on) return;
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  const d = new Date(), hhmm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"), hoy = hoyISO();
  [["manana","Mañana","Es momento de tu práctica de la mañana."],["nucleo","Núcleo","Un momento para tu Núcleo."],["noche","Noche","Es momento de tu práctica de la noche."]].forEach(s=>{
    const key = hoy + s[0];
    if(r[s[0]] === hhmm && recNotif[key] !== 1){ recNotif[key] = 1; try{ new Notification(APP_NOMBRE + " · " + s[1], { body: s[2] }); }catch(e){} }
  });
}
function fraseCalma(){ const l = calmaActivas(); return l[Math.floor(Math.random()*l.length)]; }
function abrirSOS(){
  $("#sosLinea").innerHTML = fraseCalma();
  $("#sosLinea").style.opacity = "1";
  $("#sos").classList.remove("oculto");
  document.body.classList.add("encendida");
  sosT0 = Date.now();
  const guia = $("#sosGuia");
  const actualizar = ()=>{
    const t = (Date.now() - sosT0) % 11000;
    const txt = t < 4000 ? "Inhala" : t < 5500 ? "Sostén" : t < 9500 ? "Exhala" : "Sostén";
    if(guia.textContent !== txt) guia.textContent = txt;
  };
  actualizar();
  clearInterval(sosTimer); sosTimer = setInterval(actualizar, 350);
  padBed = false;
  try{ Pad.desbloquear(); const esc = (E.ajustes.escena && E.ajustes.escena !== "auto") ? E.ajustes.escena : "oceano"; Pad.iniciar(esc, E.ajustes.padVol); }catch(e){}
}
function cerrarSOS(){
  clearInterval(sosTimer); sosTimer = null;
  $("#sos").classList.add("oculto");
  document.body.classList.remove("encendida");
  padBed = false;
  try{ Pad.detener(1.5); }catch(e){}
  ambienteBed();
}
(function cablearSOS(){
  const ab = $("#ahoraBtn"); if(ab) ab.addEventListener("click", abrirSOS);
  const hs = $("#hoyShare"); if(hs) hs.addEventListener("click", compartirHoy);
  setInterval(chequearRecordatorios, 30000);
  const sa = $("#sosSalir"); if(sa) sa.addEventListener("click", cerrarSOS);
  const ot = $("#sosOtra"); if(ot) ot.addEventListener("click", ()=>{
    const l = $("#sosLinea"); l.style.opacity = "0";
    setTimeout(()=>{ l.innerHTML = fraseCalma(); l.style.opacity = "1"; }, 320);
  });
  // Afirmaciones · repetir
  const rd = $("#repDecir"); if(rd) rd.addEventListener("click", ()=>{
    repN++; $("#repCount").textContent = repN + (repN === 1 ? " vez" : " veces");
    const t = $("#repTxt"); t.classList.remove("pulso"); void t.offsetWidth; t.classList.add("pulso");
  });
  const rl = $("#repListo"); if(rl) rl.addEventListener("click", cerrarRepetir);
  // Manifestación · 369
  const md = $("#m369Decir"); if(md) md.addEventListener("click", ()=>{
    m369.n++; $("#m369Count").textContent = m369.n + " / " + m369.meta;
    const t = $("#m369Decl"); t.classList.remove("pulso"); void t.offsetWidth; t.classList.add("pulso");
    if(m369.n >= m369.meta){ $("#m369Decir").classList.add("oculto"); $("#m369Vis").classList.remove("oculto"); }
  });
  const ml = $("#m369Listo"); if(ml) ml.addEventListener("click", ()=>cerrar369(true));
  const mx = $("#m369Salir"); if(mx) mx.addEventListener("click", ()=>cerrar369(false));
})();

(async function(){
  nodos();
  await cargar();
  aplicarTema();
  render();
  if(!E.perfil.hecho){ mostrarOnboarding(); }
  setInterval(()=>{ if(!$("#inicio").classList.contains("oculto")) render(); }, 60000);
})();
</script>
