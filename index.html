<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<script>
/* Aplica el tema guardado antes del primer pintado, para evitar parpadeo */
try{
  var _s = localStorage.getItem("practica:estado:v1");
  var _t = _s ? ((JSON.parse(_s).ajustes)||{}).tema : null; _t = _t || "sistema";
  var _oscuro = _t === "oscuro" || (_t === "sistema" && matchMedia("(prefers-color-scheme:dark)").matches);
  document.documentElement.dataset.modo = _oscuro ? "oscuro" : "claro";
  document.documentElement.style.background = _oscuro ? "#0E0D0C" : "#FAF8F3";
  var _m = document.querySelector('meta[name="theme-color"]');
  if(_m) _m.setAttribute("content", _oscuro ? "#0E0D0C" : "#FAF8F3");
}catch(e){}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Práctica">
<title>Práctica</title>
<style>
:root{
  color-scheme:light;
  --noche:#FAF8F3;
  --panel:#EFE9DF;
  --tinta:#2B2621;
  --tinta-baja:#5E554B;
  --tinta-tenue:#877E73;
  --cera:#C9B896;
  --llama:#E0942A;
  --brasa:#B4491C;
  --oro:#8A6A3E;
  --linea:rgba(43,38,33,.10);
  --linea-fuerte:rgba(43,38,33,.20);
  --serif:ui-serif,"New York",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --vela-x:20px;
}
/* Ritual de Noche dentro de tema claro: atardecer cálido, no blanco clínico */
html:not([data-modo="oscuro"]) body.tema-noche{
  --noche:#F3ECE0;
  --panel:#E9E0D1;
  --tinta:#312720;
  --tinta-baja:#655A4C;
  --llama:#CE7B2A;
  --brasa:#A9451B;
  --oro:#7E5F37;
  --linea:rgba(49,39,32,.11);
  --linea-fuerte:rgba(49,39,32,.20);
}
html[data-modo="oscuro"]{
  color-scheme:dark;
  --noche:#0E0D0C;
  --panel:#171513;
  --tinta:#ECE6DB;
  --tinta-baja:#A79C8D;
  --tinta-tenue:#726859;
  --cera:#CFC0A0;
  --llama:#F0A63C;
  --brasa:#C56A3C;
  --oro:#B79366;
  --linea:rgba(236,230,219,.08);
  --linea-fuerte:rgba(236,230,219,.16);
}
/* Ritual de Noche dentro de tema oscuro: más profundo y cálido, apto para dormir */
html[data-modo="oscuro"] body.tema-noche{
  --noche:#0A0705;
  --panel:#120C08;
  --tinta:#E4C6A0;
  --tinta-baja:#A18F79;
  --tinta-tenue:#5F5140;
  --cera:#B9A783;
  --llama:#E4903A;
  --brasa:#C56A3C;
  --oro:#B08A5C;
  --linea:rgba(228,198,160,.08);
  --linea-fuerte:rgba(228,198,160,.15);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--noche);
  color:var(--tinta);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  overflow-x:hidden;
  transition:background .5s ease,color .5s ease;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}

/* ─── LA VELADORA ─── */
#vela{
  position:fixed;left:var(--vela-x);top:0;bottom:0;width:3px;z-index:60;pointer-events:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.vela-tubo{position:relative;height:100%;width:3px}
.vela-cera{
  position:absolute;inset:0;border-radius:2px;
  background:linear-gradient(180deg,var(--cera),color-mix(in srgb,var(--cera) 45%,transparent));
  opacity:.34;
}
.vela-quemada{
  position:absolute;top:0;left:0;right:0;height:0%;border-radius:2px;
  background:rgba(0,0,0,.85);
  transition:height .28s linear;
}
.vela-llama{
  position:absolute;left:50%;top:0;width:9px;height:9px;margin-left:-4.5px;margin-top:-4.5px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 45%,#FFF3D4 0%,var(--llama) 42%,rgba(240,166,60,0) 72%);
  box-shadow:0 0 14px 4px color-mix(in srgb,var(--llama) 55%,transparent),
             0 0 40px 14px color-mix(in srgb,var(--llama) 18%,transparent);
  transition:top .28s linear,opacity .6s ease;
  opacity:.55;
}
body.encendida .vela-llama{opacity:1;animation:parpadeo 3.4s ease-in-out infinite}
@keyframes parpadeo{
  0%,100%{transform:scale(1);filter:brightness(1)}
  28%{transform:scale(1.14);filter:brightness(1.18)}
  55%{transform:scale(.94);filter:brightness(.9)}
  76%{transform:scale(1.06);filter:brightness(1.08)}
}

/* ─── ESTRUCTURA ─── */
.lienzo{
  max-width:640px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 44px) 26px calc(env(safe-area-inset-bottom) + 56px) 52px;
}
.oculto{display:none !important}

/* rúbricas — instrucciones en rojo, como en un misal */
.rubrica{
  font-family:var(--sans);font-size:10px;font-weight:600;
  text-transform:uppercase;letter-spacing:.22em;color:var(--brasa);
  margin:0 0 14px;
}
.rubrica-tenue{color:var(--tinta-tenue);letter-spacing:.2em;font-weight:500}

/* ─── INICIO ─── */
.saludo{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.14;letter-spacing:-.015em;
  margin:0 0 4px;
}
.fecha{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--tinta-baja);margin:0 0 40px}

.racha{
  display:flex;align-items:baseline;gap:12px;
  padding:16px 0;border-top:1px solid var(--linea);border-bottom:1px solid var(--linea);
  margin-bottom:38px;
}
.racha-n{font-family:var(--mono);font-size:26px;line-height:1;color:var(--llama)}
.racha-t{font-size:12px;color:var(--tinta-baja);letter-spacing:.03em;flex:1}
.marcas{display:flex;gap:7px}
.marca{
  font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  padding:5px 8px;border:1px solid var(--linea-fuerte);border-radius:2px;
  color:var(--tinta-tenue);
}
.marca.hecho{color:var(--noche);background:var(--llama);border-color:var(--llama)}

.ritos{display:flex;flex-direction:column;gap:10px;margin-bottom:34px}
.rito{
  display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--linea);border-radius:16px;
  padding:20px 20px;position:relative;
  transition:transform .2s ease,border-color .2s ease,background .2s ease;
}
.rito:hover,.rito:focus-visible{transform:translateY(-1px);border-color:var(--linea-fuerte)}
.rito:focus-visible{outline:2px solid var(--llama);outline-offset:3px}
.rito-alto{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.rito-num{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--tinta-tenue);
  display:block;margin-bottom:8px;
}
.rito-nom{font-family:var(--serif);font-size:1.45rem;line-height:1;letter-spacing:-.01em}
.rito-dur{font-family:var(--mono);font-size:10.5px;color:var(--tinta-baja);white-space:nowrap}
.rito-sub{font-size:12.5px;color:var(--tinta-baja);margin-top:7px}
.rito.sugerido .rito-nom{color:var(--llama)}
.rito.sugerido .rito-num{color:var(--brasa)}

.menu{display:flex;flex-wrap:wrap;gap:0}
.menu-item{
  flex:1 1 0;min-width:96px;padding:16px 0;text-align:left;
  border-top:1px solid var(--linea);
  font-size:14px;letter-spacing:.005em;color:var(--tinta-baja);
  transition:color .2s ease;
}
.menu-item:hover,.menu-item:focus-visible{color:var(--tinta)}
.menu-item:focus-visible{outline:1px solid var(--llama);outline-offset:3px}
.aviso{
  margin-top:26px;padding:16px 18px;border-left:3px solid var(--brasa);
  border-radius:0 12px 12px 0;
  background:var(--panel);font-size:13px;line-height:1.6;color:var(--tinta-baja);
}
.aviso b{color:var(--tinta);font-weight:600}

/* ─── PRÁCTICA ─── */
#practica{
  position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
  background:var(--noche);
  padding:calc(env(safe-area-inset-top) + 22px) 24px calc(env(safe-area-inset-bottom) + 20px) 52px;
}
.p-alto{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:22px}
.p-mov{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--tinta-tenue)}
.p-salir{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--tinta-baja);padding:6px 0 6px 12px}
.p-salir:focus-visible{outline:1px solid var(--llama);outline-offset:3px}

.p-centro{flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0}
.p-bloque{
  font-family:var(--serif);font-size:.95rem;letter-spacing:.02em;color:var(--oro);
  margin:0 0 6px;font-style:italic;
}
.p-linea{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(1.55rem,5.6vw,2.4rem);line-height:1.32;letter-spacing:-.012em;
  margin:0;
  animation:entra .7s cubic-bezier(.2,.7,.3,1);
}
@keyframes entra{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.p-nota{margin-top:22px;font-size:13px;color:var(--tinta-baja);line-height:1.6;max-width:34ch}

/* respiración */
.respiro{display:flex;flex-direction:column;align-items:flex-start;gap:24px}
.respiro-aro{
  width:78px;height:78px;border-radius:50%;
  border:1px solid var(--linea-fuerte);
  display:flex;align-items:center;justify-content:center;
  transition:transform 4s cubic-bezier(.4,0,.5,1),border-color 1.4s ease;
}
.respiro-aro.dentro{transform:scale(1.55);border-color:var(--llama)}
.respiro-nucleo{width:9px;height:9px;border-radius:50%;background:var(--llama);opacity:.75}
.respiro-txt{font-family:var(--serif);font-size:1.5rem;color:var(--tinta)}

.p-bajo{transition:opacity .5s ease}
.p-bajo.dormido{opacity:.16}
.p-barra{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.p-btn{
  padding:13px 15px;border:1px solid var(--linea-fuerte);border-radius:2px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-baja);
  transition:border-color .2s ease,color .2s ease;
}
.p-btn:hover,.p-btn:focus-visible{border-color:var(--tinta-baja);color:var(--tinta)}
.p-btn:focus-visible{outline:none;border-color:var(--llama)}
.p-btn.principal{flex:1;color:var(--tinta);border-color:var(--linea-fuerte);text-align:center}
.p-btn.acento{color:var(--llama);border-color:color-mix(in srgb,var(--llama) 45%,transparent)}
.p-pie{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:10px;color:var(--tinta-tenue);letter-spacing:.08em}

/* lista de audio */
.audio-lista{overflow-y:auto;flex:1;padding:8px 0 20px}
.audio-bloque{margin-bottom:26px}
.audio-linea{font-family:var(--serif);font-size:1.02rem;line-height:1.6;color:var(--tinta-baja);margin:0 0 5px}

/* ─── HOJAS (modales) ─── */
.hoja{
  position:fixed;inset:0;z-index:70;background:rgba(6,5,4,.86);
  display:flex;align-items:flex-end;justify-content:center;
  animation:vela-in .3s ease;
}
@keyframes vela-in{from{opacity:0}to{opacity:1}}
.hoja-caja{
  width:100%;max-width:640px;max-height:90vh;overflow-y:auto;
  background:var(--panel);border-top:1px solid var(--linea-fuerte);
  border-radius:22px 22px 0 0;
  padding:30px 28px calc(env(safe-area-inset-bottom) + 30px);
  animation:sube .34s cubic-bezier(.2,.8,.3,1);
}
@keyframes sube{from{transform:translateY(26px)}to{transform:none}}
.hoja-tit{font-family:var(--serif);font-size:1.5rem;margin:0 0 6px;letter-spacing:-.01em}
.hoja-sub{font-size:13px;color:var(--tinta-baja);line-height:1.6;margin:0 0 26px}
.campo{margin-bottom:24px}
.campo-et{display:block;font-size:13px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--tinta);margin-bottom:10px}
/* control segmentado (tema) */
.segmento{display:flex;gap:5px;background:var(--noche);border:1px solid var(--linea);border-radius:13px;padding:5px}
.seg{flex:1;padding:11px 6px;border-radius:9px;font-size:13.5px;color:var(--tinta-baja);text-align:center;transition:background .2s ease,color .2s ease}
.seg.activo{background:color-mix(in srgb,var(--llama) 20%,transparent);color:var(--tinta);font-weight:600}
.seg:focus-visible{outline:2px solid var(--llama);outline-offset:2px}
.campo-in,.campo-sel{
  width:100%;background:transparent;border:none;border-bottom:1px solid var(--linea-fuerte);
  padding:9px 0;font-family:var(--serif);font-size:1.12rem;outline:none;
  border-radius:0;
}
.campo-in:focus,.campo-sel:focus{border-bottom-color:var(--llama)}
.campo-in::placeholder{color:var(--tinta-tenue)}
.campo-sel{font-family:var(--sans);font-size:.95rem;appearance:none;cursor:pointer}
.campo-sel option{background:var(--panel);color:var(--tinta)}
input[type=range].campo-in{
  appearance:none;-webkit-appearance:none;height:26px;padding:0;border-bottom:none;cursor:pointer;background:transparent;
}
input[type=range].campo-in::-webkit-slider-runnable-track{height:1px;background:var(--linea-fuerte)}
input[type=range].campo-in::-moz-range-track{height:1px;background:var(--linea-fuerte)}
input[type=range].campo-in::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--llama);margin-top:-6px;
  box-shadow:0 0 10px 2px color-mix(in srgb,var(--llama) 40%,transparent);
}
input[type=range].campo-in::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--llama)}
.campo-ayuda{font-size:12px;color:var(--tinta-baja);margin-top:8px;line-height:1.55}

.fila{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--linea)}
.fila-txt{font-size:14px}
.fila-ayuda{font-size:12px;color:var(--tinta-baja);margin-top:3px;line-height:1.5}
.switch{
  width:44px;height:25px;border-radius:13px;border:1px solid var(--linea-fuerte);
  position:relative;flex-shrink:0;transition:background .25s ease,border-color .25s ease;
}
.switch::after{
  content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;
  background:var(--tinta-tenue);transition:transform .25s cubic-bezier(.3,.8,.4,1),background .25s ease;
}
.switch.on{background:color-mix(in srgb,var(--llama) 22%,transparent);border-color:var(--llama)}
.switch.on::after{transform:translateX(19px);background:var(--llama)}
.switch:focus-visible{outline:1px solid var(--llama);outline-offset:3px}

.check{display:flex;align-items:flex-start;gap:14px;padding:15px 0;border-bottom:1px solid var(--linea);width:100%;text-align:left}
.check-caja{
  width:19px;height:19px;border:1px solid var(--linea-fuerte);flex-shrink:0;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--noche);
  transition:background .2s ease,border-color .2s ease;
}
.check.on .check-caja{background:var(--llama);border-color:var(--llama)}
.check-txt{font-size:14.5px;line-height:1.45}
.check-n{font-family:var(--mono);font-size:10px;color:var(--tinta-tenue);margin-right:9px}
.veredicto{
  margin-top:20px;padding:15px 16px;border-left:2px solid var(--llama);background:rgba(0,0,0,.25);
  font-family:var(--serif);font-size:1.05rem;line-height:1.5;
}
.acciones{display:flex;gap:9px;margin-top:26px}
.accion{
  flex:1;padding:15px;border:1px solid var(--linea-fuerte);border-radius:12px;text-align:center;
  font-size:14px;letter-spacing:.005em;font-weight:500;transition:border-color .2s,color .2s,background .2s;
}
.accion:hover,.accion:focus-visible{border-color:var(--tinta-baja)}
.accion:focus-visible{outline:none;border-color:var(--llama)}
.accion.llena{background:var(--llama);border-color:var(--llama);color:#120C05;font-weight:600}
.doctrina-li{padding:13px 0;border-bottom:1px solid var(--linea);font-family:var(--serif);font-size:1.02rem;line-height:1.45;color:var(--tinta-baja)}

/* ── Controles del lector (voz / ambiente / velocidad) ── */
.p-controles{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.p-tog{
  padding:9px 14px;border:1px solid var(--linea-fuerte);border-radius:999px;
  font-size:12.5px;letter-spacing:.01em;color:var(--tinta-baja);
  transition:border-color .2s,color .2s,background .2s;
}
.p-tog.on{border-color:var(--llama);color:var(--tinta);background:color-mix(in srgb,var(--llama) 16%,transparent)}
.p-tog:focus-visible{outline:2px solid var(--llama);outline-offset:2px}
.p-vel{
  padding:9px 13px;border:1px solid var(--linea-fuerte);border-radius:999px;
  font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--tinta-baja);min-width:46px;text-align:center;
  transition:border-color .2s,color .2s;
}
.p-vel:focus-visible{outline:2px solid var(--llama);outline-offset:2px}

/* ── Doctrina: acordeón ── */
.doctrina-item{border-bottom:1px solid var(--linea)}
.doctrina-cab{
  display:flex;width:100%;justify-content:space-between;align-items:center;gap:14px;
  padding:16px 0;text-align:left;font-family:var(--serif);font-size:1.06rem;line-height:1.4;color:var(--tinta);
}
.doctrina-cab:focus-visible{outline:2px solid var(--llama);outline-offset:3px}
.doctrina-mas{font-family:var(--sans);font-size:1.35rem;line-height:1;color:var(--brasa);flex-shrink:0;transition:transform .28s cubic-bezier(.3,.8,.4,1)}
.doctrina-cab.abierto .doctrina-mas{transform:rotate(45deg)}
.doctrina-cuerpo{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.3,.8,.4,1);color:var(--tinta-baja);font-size:.99rem;line-height:1.64}
.doctrina-cuerpo.abierto{max-height:2600px;padding-bottom:20px}
.doctrina-cuerpo p{margin:0 0 13px}
.doctrina-cuerpo p:last-child{margin-bottom:0}
.doctrina-cuerpo .escr{font-style:italic;color:var(--oro)}

/* ── Ancla (salmos / grounding) ── */
.ancla-caja{
  min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:20px 8px 26px;
}
.ancla-txt{font-family:var(--serif);font-size:1.5rem;line-height:1.45;color:var(--tinta);margin:0;max-width:30ch}
.ancla-ref{display:block;margin-top:16px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-baja)}
.salmo-caja{min-height:auto;padding:22px 4px 26px}
.ancla-txt.salmo{font-size:1.18rem;line-height:1.62;max-width:38ch}

/* ── Editor · Mi contenido ── */
.ed-lista{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.ed-item{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.ed-item-t{flex:1;text-align:left;padding:14px 16px;font-size:14px;color:var(--tinta);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-item-x{padding:14px 15px;color:var(--tinta-tenue);font-size:13px;flex-shrink:0;transition:color .2s}
.ed-item-x:hover,.ed-item-x:focus-visible{color:var(--brasa)}
.ed-vacio{font-size:13.5px;line-height:1.6;color:var(--tinta-tenue);padding:4px 0 22px}
.ed-form{border-top:1px solid var(--linea);padding-top:22px}
.ed-form-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-baja);margin:0 0 14px}
.ed-in{margin-top:10px}

/* ── Registro (journal + check-ins) ── */
.campo-area{
  width:100%;background:transparent;border:1px solid var(--linea-fuerte);border-radius:12px;
  padding:13px 14px;font-family:var(--serif);font-size:1.02rem;line-height:1.6;color:var(--tinta);
  outline:none;resize:vertical;min-height:70px;
}
.campo-area:focus{border-color:var(--llama)}
.campo-area::placeholder{color:var(--tinta-tenue)}
.campo-area.grande{min-height:220px}
.cad-tabs{margin-bottom:22px}
.cad-fecha{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--tinta-baja);margin:0 0 18px}
.reg-guardado{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--tinta-tenue);margin-top:8px;min-height:14px;transition:opacity .3s}
.hito{display:flex;align-items:center;gap:11px;padding:9px 0}
.hito-caja{
  width:20px;height:20px;border:1px solid var(--linea-fuerte);border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--noche);
  transition:background .2s,border-color .2s;
}
.hito.on .hito-caja{background:var(--llama);border-color:var(--llama)}
.hito-in{flex:1;background:transparent;border:none;border-bottom:1px solid transparent;padding:5px 0;font-family:var(--serif);font-size:1rem;color:var(--tinta);outline:none}
.hito-in:focus{border-bottom-color:var(--linea-fuerte)}
.hito.on .hito-in{color:var(--tinta-baja)}
.reg-hist{margin-top:8px;border-top:1px solid var(--linea);padding-top:6px}
.reg-hist-t{font-size:12px;letter-spacing:.02em;color:var(--tinta-baja);margin:14px 0 4px}
.reg-item{
  display:block;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--linea);
}
.reg-item-f{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--brasa);margin-bottom:5px}
.reg-item-p{font-family:var(--serif);font-size:.98rem;line-height:1.45;color:var(--tinta-baja);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reg-vacio{font-size:13px;color:var(--tinta-tenue);line-height:1.6;padding:8px 0 4px}

/* ── Meditación (lista) ── */
.med-lista{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.med-item{
  display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;
  background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:20px;
  text-align:left;transition:transform .2s ease,border-color .2s ease;
}
.med-item:hover,.med-item:focus-visible{transform:translateY(-1px);border-color:var(--linea-fuerte)}
.med-item:focus-visible{outline:2px solid var(--llama);outline-offset:3px}
.med-nom{font-family:var(--serif);font-size:1.2rem;color:var(--tinta)}
.med-dur{font-family:var(--mono);font-size:10.5px;color:var(--tinta-baja);white-space:nowrap}

/* ── Sonido (hub + pomodoro) ── */
.son-now{display:flex;align-items:center;justify-content:space-between;gap:12px;background:color-mix(in srgb,var(--llama) 14%,transparent);border:1px solid var(--linea-fuerte);border-radius:12px;padding:12px 15px;margin-bottom:20px;font-size:13.5px;color:var(--tinta)}
.son-stop{font-size:12px;color:var(--brasa);white-space:nowrap;padding:4px 8px}
.son-cat{margin-bottom:20px}
.son-cat-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-baja);margin:0 0 11px}
.son-chips{display:flex;flex-wrap:wrap;gap:8px}
.son-chip{padding:11px 15px;border:1px solid var(--linea-fuerte);border-radius:999px;font-size:13.5px;color:var(--tinta-baja);transition:border-color .2s,color .2s,background .2s}
.son-chip.on{border-color:var(--llama);color:var(--tinta);background:color-mix(in srgb,var(--llama) 18%,transparent)}
.son-chip:focus-visible{outline:2px solid var(--llama);outline-offset:2px}
.son-pomo{margin-top:28px;padding-top:22px;border-top:1px solid var(--linea)}
.pomo-reloj{font-family:var(--mono);font-size:1.5rem;letter-spacing:.02em;color:var(--tinta);text-align:center;padding:14px 0 20px}

/* ── Navegación inferior (tabs) ── */
#inicio{padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}
.panel-titulo{font-family:var(--serif);font-size:1.75rem;color:var(--tinta);margin:8px 0 24px}
.nav-cards{display:flex;flex-direction:column;gap:10px}
.nav-card{display:flex;width:100%;align-items:center;justify-content:space-between;gap:14px;background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:18px 20px;text-align:left;transition:transform .2s ease,border-color .2s ease}
.nav-card:hover,.nav-card:focus-visible{transform:translateY(-1px);border-color:var(--linea-fuerte)}
.nav-card:focus-visible{outline:2px solid var(--llama);outline-offset:3px}
.nav-card-tx{display:flex;flex-direction:column;gap:3px}
.nav-card-t{font-family:var(--serif);font-size:1.18rem;color:var(--tinta)}
.nav-card-s{font-size:12.5px;color:var(--tinta-baja)}
.nav-card-ch{color:var(--tinta-tenue);font-size:22px;flex-shrink:0}
.gear{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:16px;z-index:50;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--tinta-baja);opacity:.75;transition:opacity .2s}
.gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.gear:hover,.gear:focus-visible{opacity:1}
.gear:focus-visible{outline:2px solid var(--llama);outline-offset:2px;border-radius:50%}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:62;display:flex;justify-content:space-around;align-items:flex-end;
  padding:9px 4px calc(env(safe-area-inset-bottom) + 9px);
  background:var(--panel);border-top:1px solid var(--linea-fuerte)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;color:var(--tinta-tenue);transition:color .2s ease}
.tab.activo{color:var(--tinta)}
.tab-ic{width:23px;height:23px}
.tab-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab-lb{font-size:10.5px;letter-spacing:.02em}
.tab:focus-visible{outline:2px solid var(--llama);outline-offset:2px;border-radius:10px}
body.encendida .tabbar,body.encendida .gear{display:none}

/* ── Onboarding ── */
.onb{position:fixed;inset:0;z-index:90;background:var(--noche);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 40px) 30px calc(env(safe-area-inset-bottom) + 30px)}
.onb-dots{display:flex;gap:7px;justify-content:center}
.onb-dot{width:7px;height:7px;border-radius:50%;background:var(--linea-fuerte);transition:background .3s ease}
.onb-dot.on{background:var(--llama)}
.onb-cont{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto;width:100%}
.onb-cont h1,.onb-cont p{animation:onbIn .35s ease}
@keyframes onbIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.onb-mark{font-size:2.4rem;color:var(--llama);margin-bottom:18px;line-height:1}
.onb-t{font-family:var(--serif);font-size:2rem;line-height:1.15;color:var(--tinta);margin:0 0 14px}
.onb-p{font-size:15px;line-height:1.6;color:var(--tinta-baja);margin:0 0 28px}
.onb-input{width:100%;background:transparent;border:1px solid var(--linea-fuerte);border-radius:14px;padding:15px 16px;font-family:var(--serif);font-size:1.25rem;color:var(--tinta);outline:none;margin-bottom:28px}
.onb-input:focus{border-color:var(--llama)}
.onb-chips{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:30px}
.onb-chip{padding:12px 16px;border:1px solid var(--linea-fuerte);border-radius:999px;font-size:14px;color:var(--tinta-baja);transition:border-color .2s,color .2s,background .2s}
.onb-chip.on{border-color:var(--llama);color:var(--tinta);background:color-mix(in srgb,var(--llama) 16%,transparent)}
.onb-chip:focus-visible{outline:2px solid var(--llama);outline-offset:2px}
.onb-btn{margin-top:16px;padding:16px;border-radius:14px;background:var(--tinta);color:var(--noche);font-size:15px;font-weight:500;transition:opacity .2s ease}
.onb-btn:active{opacity:.85}
.onb-btn:focus-visible{outline:2px solid var(--llama);outline-offset:3px}
.onb-saltar{align-self:center;padding:10px;font-size:13px;color:var(--tinta-tenue);transition:color .2s ease}
.onb-saltar:hover,.onb-saltar:focus-visible{color:var(--tinta-baja)}
.onb-top{display:flex;align-items:center;justify-content:center;position:relative;min-height:24px}
.onb-back{position:absolute;left:0;top:50%;transform:translateY(-50%);width:34px;height:34px;font-size:20px;color:var(--tinta-baja);display:flex;align-items:center;justify-content:center}
.onb-back:focus-visible{outline:2px solid var(--llama);outline-offset:2px;border-radius:50%}
.onb-opts{display:flex;flex-direction:column;gap:9px;margin-bottom:30px}
.onb-opt{padding:16px 18px;border:1px solid var(--linea-fuerte);border-radius:14px;font-size:15px;color:var(--tinta-baja);text-align:left;transition:border-color .2s,color .2s,background .2s}
.onb-opt.on{border-color:var(--llama);color:var(--tinta);background:color-mix(in srgb,var(--llama) 14%,transparent)}
.onb-opt:focus-visible{outline:2px solid var(--llama);outline-offset:2px}
.onb-saltar-paso{align-self:center;margin-top:12px;padding:8px;font-size:13px;color:var(--tinta-tenue);transition:color .2s ease}
.onb-saltar-paso:hover,.onb-saltar-paso:focus-visible{color:var(--tinta-baja)}
.pref-bloque{margin-bottom:26px}
.pref-t{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-baja);margin:0 0 13px}
.pref-bloque .onb-chips,.pref-bloque .onb-opts{margin-bottom:0}

/* ── Mensaje de hoy + Ahora mismo (inicio) ── */
.hoy{background:var(--panel);border:1px solid var(--linea);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.hoy-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-baja);margin:0 0 8px}
.hoy-txt{font-family:var(--serif);font-size:1.2rem;line-height:1.4;color:var(--tinta);margin:0}
.hoy-share{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:8px 14px;border:1px solid var(--linea-fuerte);border-radius:999px;font-size:12.5px;color:var(--tinta-baja);transition:border-color .2s,color .2s}
.hoy-share svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hoy-share:hover,.hoy-share:focus-visible{border-color:var(--llama);color:var(--tinta)}
.hoy-share:focus-visible{outline:2px solid var(--llama);outline-offset:2px}
.campo-rec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.campo-rec .campo-et{margin:0}
.campo-time{width:auto;flex:0 0 auto;padding:9px 12px;border:1px solid var(--linea-fuerte);border-radius:10px}
.ahora{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;margin-top:14px;padding:15px 18px;border-radius:14px;border:1px solid var(--linea-fuerte);background:transparent;transition:border-color .2s,background .2s}
.ahora:hover,.ahora:focus-visible{border-color:var(--llama);background:color-mix(in srgb,var(--llama) 8%,transparent)}
.ahora:focus-visible{outline:2px solid var(--llama);outline-offset:3px}
.ahora-t{font-family:var(--serif);font-size:1.1rem;color:var(--tinta)}
.ahora-s{font-size:12.5px;color:var(--tinta-baja)}

/* ── SOS · Ahora mismo ── */
.sos{position:fixed;inset:0;z-index:95;background:var(--noche);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 30px) 32px calc(env(safe-area-inset-bottom) + 30px);gap:0}
.sos-respira{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-bottom:38px;
  background:radial-gradient(circle at 50% 45%, color-mix(in srgb,var(--llama) 22%,transparent), transparent 70%);
  border:1px solid var(--linea-fuerte);animation:respirar 11s ease-in-out infinite}
.sos-guia{font-family:var(--serif);font-size:1.15rem;color:var(--tinta-baja);letter-spacing:.02em}
@keyframes respirar{
  0%{transform:scale(.72)}
  36%{transform:scale(1.05)}
  50%{transform:scale(1.05)}
  86%{transform:scale(.72)}
  100%{transform:scale(.72)}
}
.sos-linea{font-family:var(--serif);font-size:1.5rem;line-height:1.5;color:var(--tinta);text-align:center;max-width:30ch;margin:0 0 34px;min-height:4.5rem;transition:opacity .5s ease}
.sos-acc{display:flex;gap:12px}
.sos-btn{padding:13px 26px;border-radius:12px;border:1px solid var(--linea-fuerte);font-size:14px;color:var(--tinta-baja);transition:border-color .2s,color .2s}
.sos-btn:hover,.sos-btn:focus-visible{border-color:var(--llama);color:var(--tinta)}
.sos-btn:focus-visible{outline:2px solid var(--llama);outline-offset:2px}
.sos-salir{border-color:transparent;color:var(--tinta-tenue)}

/* ── Afirmaciones · repetir + Manifestación · 369 (overlays) ── */
.rep,.m369{position:fixed;inset:0;z-index:95;background:var(--noche);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 40px) 32px calc(env(safe-area-inset-bottom) + 34px)}
.rep-txt,.m369-decl{font-family:var(--serif);font-size:1.9rem;line-height:1.4;color:var(--tinta);text-align:center;max-width:26ch;margin:0 0 20px}
.rep-count,.m369-count{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--tinta-baja);margin:0 0 28px;min-height:1.2em}
.m369-count{margin:0 0 26px}
.rep-decir{padding:15px 34px;border-radius:999px;background:var(--tinta);color:var(--noche);font-size:15px;font-weight:500;transition:transform .12s ease,opacity .2s}
.rep-decir:active{transform:scale(.96)}
.rep-decir:focus-visible{outline:2px solid var(--llama);outline-offset:3px}
.pulso{animation:pulsoAf .5s ease}
@keyframes pulsoAf{0%{transform:scale(1)}40%{transform:scale(1.04);opacity:.85}100%{transform:scale(1)}}
.m369{justify-content:center}
.m369-x{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:20px;width:38px;height:38px;font-size:17px;color:var(--tinta-tenue);display:flex;align-items:center;justify-content:center}
.m369-vis{display:flex;flex-direction:column;align-items:center;gap:22px;animation:onbIn .5s ease}
.m369-vis-t{font-family:var(--serif);font-size:1.3rem;line-height:1.5;color:var(--tinta-baja);text-align:center;max-width:24ch;margin:0}
.m369-listo{padding:15px 40px;border-radius:12px;background:var(--tinta);color:var(--noche);font-size:15px;font-weight:500}
.m369-listo:focus-visible{outline:2px solid var(--llama);outline-offset:3px}

/* ── Manifestación (superficie) ── */
.manif-decl{background:var(--panel);border:1px solid var(--linea-fuerte);border-radius:16px;padding:20px;margin-bottom:20px;text-align:center}
.manif-decl-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-baja);margin:0 0 10px}
.manif-decl-x{font-family:var(--serif);font-size:1.3rem;line-height:1.4;color:var(--tinta);margin:0 0 14px}
.manif-cambiar{font-size:12.5px;color:var(--brasa);padding:5px}
.manif-ses{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.manif-sesion{display:flex;align-items:center;justify-content:space-between;width:100%;padding:17px 20px;border:1px solid var(--linea-fuerte);border-radius:14px;text-align:left;transition:border-color .2s,background .2s}
.manif-sesion:hover,.manif-sesion:focus-visible{border-color:var(--llama)}
.manif-sesion.hecho{border-color:var(--linea);background:color-mix(in srgb,var(--llama) 8%,transparent);opacity:.75}
.manif-ses-t{font-family:var(--serif);font-size:1.15rem;color:var(--tinta)}
.manif-ses-r{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--tinta-baja)}
.manif-opts{display:flex;flex-direction:column;gap:9px}
.manif-opt{padding:16px 18px;border:1px solid var(--linea-fuerte);border-radius:14px;font-family:var(--serif);font-size:1.08rem;color:var(--tinta);text-align:left;transition:border-color .2s,background .2s}
.manif-opt:hover,.manif-opt:focus-visible{border-color:var(--llama);background:color-mix(in srgb,var(--llama) 8%,transparent)}

/* ── Feedback (👍/👎) ── */
.fb{display:flex;justify-content:center;gap:14px;margin:2px 0 20px}
.fb-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--linea-fuerte);display:flex;align-items:center;justify-content:center;color:var(--tinta-baja);transition:border-color .2s,color .2s,background .2s,transform .12s}
.fb-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.fb-btn:active{transform:scale(.9)}
.fb-btn:hover,.fb-btn:focus-visible{border-color:var(--llama);color:var(--tinta)}
.fb-btn:focus-visible{outline:2px solid var(--llama);outline-offset:2px}
.fb-abajo svg{transform:rotate(180deg)}
.fb-abajo:hover,.fb-abajo:focus-visible{border-color:var(--brasa);color:var(--brasa)}
.pref-reset{display:block;width:100%;text-align:center;padding:12px;margin-top:6px;font-size:13px;color:var(--tinta-tenue);transition:color .2s}
.pref-reset:hover,.pref-reset:focus-visible{color:var(--tinta-baja)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.05s !important}
  .respiro-aro{transition-duration:4s !important}
}
@media (min-width:700px){ :root{--vela-x:34px} .lienzo,#practica{padding-left:78px} }
</style>
</head>
<body>

<div id="vela"><div class="vela-tubo">
  <div class="vela-cera"></div>
  <div class="vela-quemada" id="velaQuemada"></div>
  <div class="vela-llama" id="velaLlama"></div>
</div></div>

<!-- ══════ INICIO ══════ -->
<main class="lienzo" id="inicio">
  <button class="gear" id="btnAjustes" data-abrir="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>

  <div class="panel" id="panelInicio">
    <p class="rubrica" id="rubricaHora">Antes de empezar</p>
    <h1 class="saludo" id="saludo">Buenos días</h1>
    <p class="fecha" id="fecha"></p>

    <div class="racha">
      <span class="racha-n" id="rachaN">0</span>
      <span class="racha-t" id="rachaT">días seguidos</span>
      <div class="marcas">
        <span class="marca" id="marcaAM">AM</span>
        <span class="marca" id="marcaPM">PM</span>
      </div>
    </div>

    <div class="hoy" id="hoy">
      <p class="hoy-label">Mensaje de hoy</p>
      <p class="hoy-txt" id="hoyTxt"></p>
      <button class="hoy-share" id="hoyShare"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6l-4-4-4 4M12 2v13M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>Compartir</button>
    </div>

    <div class="ritos" id="ritos"></div>

    <button class="ahora" id="ahoraBtn">
      <span class="ahora-t">Ahora mismo</span>
      <span class="ahora-s">Un momento difícil · respira conmigo</span>
    </button>

    <div class="aviso oculto" id="avisoVision"></div>
  </div>

  <div class="panel oculto" id="panelExplorar">
    <h1 class="panel-titulo">Explorar</h1>
    <div class="nav-cards">

/* ════════════════ ALMACENAMIENTO ════════════════ */
const Guardado = (() => {
  const memoria = {};
  const nativo = (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function");
  async function leer(clave){
    if(nativo){
      try{ const r = await window.storage.get(clave); return r && r.value ? JSON.parse(r.value) : null; }
      catch(e){ return null; }
    }
    try{ const v = localStorage.getItem(clave); return v ? JSON.parse(v) : null; }
    catch(e){ return clave in memoria ? memoria[clave] : null; }
  }
  async function escribir(clave, valor){
    if(nativo){
      try{ await window.storage.set(clave, JSON.stringify(valor)); return true; }
      catch(e){ memoria[clave]=valor; return false; }
    }
    try{ localStorage.setItem(clave, JSON.stringify(valor)); return true; }
    catch(e){ memoria[clave]=valor; return true; }
  }
  return { leer, escribir };
})();

}

const mqOscuro = window.matchMedia("(prefers-color-scheme: dark)");
function modoResuelto(){
  const t = (E.ajustes && E.ajustes.tema) || "sistema";
  return t === "sistema" ? (mqOscuro.matches ? "oscuro" : "claro") : t;
}
function aplicarTema(){
  const m = modoResuelto();
  document.documentElement.dataset.modo = m;
  document.documentElement.style.background = m === "oscuro" ? "#0E0D0C" : "#FAF8F3";
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", m === "oscuro" ? "#0E0D0C" : "#FAF8F3");
}

function semanaISO(){
  const d = new Date(); const j = new Date(d.getFullYear(),d.getMonth(),d.getDate());

  return j.getFullYear()+"-S"+String(Math.ceil((((j-a)/86400000)+1)/7)).padStart(2,"0");
}

const DOCTRINA = [
  { t:"El bloque sobre «Yo Soy» como mandato creador",
    e:`<p>Cuando Moisés le pregunta a Dios su nombre, la respuesta no es un sustantivo sino un verbo: <span class="escr">«Yo soy el que soy»</span>. El nombre de lo divino es, literalmente, existir. Y en Génesis nada se crea con las manos: se crea hablando. «Y dijo Dios… y fue.» La palabra va antes que la forma.</p>
    <p>Hay frases que no describen la realidad, la instauran. Cuando prometes, cuando nombras, cuando declaras algo sobre ti, no estás reportando un hecho: lo estás empezando a fabricar. «Yo soy» es de esa clase. Lo que pones después de esas dos palabras no es una observación sobre quién eres; es una orden a lo que todavía no existe.</p>
    <p>Por eso conviene cuidar esa frase. «Yo soy» un inútil, «yo soy» un ansioso, «yo soy» invisible: cada una siembra. No se trata de fingir lo que no sientes. Se trata de no firmar con tu propio nombre aquello que no quieres construir.</p>` },
  { t:"Actuar rápido cuando surge una idea nueva, antes de que la mente la mate",
    e:`<p>Hay una ventana muy corta entre que llega una idea y que llega la duda. La idea aparece limpia; unos segundos después, la mente convoca a sus abogados —el «qué dirán», el «y si fallo», el «mejor mañana»— y la idea muere de mil cortes razonables.</p>
    <p>La Escritura tiene una palabra para ese instante: <span class="escr">«Hoy, si oís su voz, no endurezcáis el corazón»</span>. Hoy. Y en la parábola de los talentos, al que castigan no es al que pierde dinero, sino al que, de puro miedo, entierra lo que le dieron. Ahí el error es la parálisis.</p>
    <p>Lo que la psicología llama resistencia y los antiguos llamaban acedia es lo mismo: esa fuerza que aparece justo cuando ibas a crear algo, siempre disfrazada de prudencia. No se vence pensando mejor. Se vence moviéndote antes de que el pensamiento alcance a organizarse en tu contra: un primer paso pequeño, mientras la idea todavía respira.</p>` },
  { t:"«¿Cuándo va a despegar tu vida?» — Ser / Hacer / Tener",
    e:`<p>Casi todos vivimos al revés: <em>tener</em> para poder <em>hacer</em> y así por fin <em>ser</em>. «Cuando tenga dinero haré lo que amo, y entonces seré libre.» Ese orden nunca arranca, porque deja el ser al final de una fila que no termina.</p>
    <p>Dale la vuelta: <em>sé</em> primero, y desde ahí <em>haz</em>, y el <em>tener</em> llega de añadidura. <span class="escr">«Cual es su pensamiento en su corazón, tal es él.»</span> La identidad va antes que la acción; no actúas para volverte alguien, actúas porque ya decidiste quién eres.</p>
    <p>De ahí los dos pasos: mirar el pensamiento, y volver a pensarlo. Pablo lo llama <span class="escr">«renovar el entendimiento»</span>; los estoicos, la disciplina del asentimiento. Entre lo que te pasa y tu respuesta hay un espacio, y en ese espacio eres libre de rechazar un pensamiento y elegir otro. No eres lo que se te ocurre sin permiso. Eres el que decide qué se queda.</p>` },
  { t:"«Hoy recuerda que dentro de ti hay más fuerza…»",
    e:`<p>La fuerza que crees tener es la que has medido en días fáciles. La que de verdad tienes no aparece hasta que la carga la exige. Nadie conoce el fondo de su reserva hasta que toca fondo, y descubre que abajo había más piso.</p>
    <p><span class="escr">«Todo lo puedo en aquel que me fortalece.»</span> Fíjate que no dice «todo lo puedo yo». La fuerza no es solo voluntad apretada; es algo que también se recibe, que se abre cuando dejas de fingir que puedes solo. Y hay una paradoja escrita: <span class="escr">«mi poder se perfecciona en la debilidad»</span>. El punto donde te sientes más frágil suele ser por donde entra la fuerza que no era tuya.</p>
    <p>No es una frase para animarte. Es un dato: cuando sientas que ya no puedes más, casi siempre estás lejos todavía de tu límite real.</p>` },
  { t:"«Hoy puede ser un buen día para empezar de nuevo…»",
    e:`<p>La culpa te amarra al pasado convenciéndote de que ya está escrito quién eres. Pero el tiempo no funciona así. Solo hay un punto desde donde puedes mover algo, y es ahora: nunca ayer, nunca mañana.</p>
    <p><span class="escr">«Sus misericordias son nuevas cada mañana.»</span> No cada año, ni en cada gran decisión: cada mañana. La gracia reinicia la cuenta con una frecuencia casi terca. Y la promesa se repite: <span class="escr">«He aquí, hago cosa nueva»</span>, <span class="escr">«las cosas viejas pasaron»</span>.</p>
    <p>Empezar de nuevo no es borrar lo que pasó; es negarte a que lo que pasó decida lo que sigue. No hace falta esperar al lunes, ni a enero, ni a sentirte listo. El permiso no depende de una fecha, sino de que uses el único día en el que puedes hacer algo.</p>` },
  { t:"«La única persona que me quiere triunfar más que yo es el yo de mañana»",
    e:`<p>Piensa en tu yo de mañana como una persona de verdad que depende de ti. Todo lo que haces hoy —lo que comes, lo que dejas sin hacer, la hora a la que te duermes, la promesa que cumples o rompes— es un mensaje que le mandas. Él vive con las consecuencias de tu disciplina o de tu pereza, y no tiene voto.</p>
    <p>La sabiduría antigua ya lo intuía: <span class="escr">«Ve a la hormiga… prepara en el verano su comida.»</span> Y la ley de sembrar es pareja: <span class="escr">«todo lo que el hombre sembrare, eso segará»</span>. Lo que plantas hoy no lo cosechas tú; lo cosecha él.</p>

const Pad = (() => {
  let ctx=null, master=null, fuentes=[], moduladores=[], vivo=false, desbloqueado=false;
  const PRESETS = {
    vela:   { tipo:"tono", raiz:110,    arm:[1,1.5,2,3],   corte:900,  Q:.6, lfoHz:.05,  lfoAmp:260,  forma:"triangle" },
    dia:    { tipo:"tono", raiz:110,    arm:[1,1.5,2,3],   corte:900,  Q:.6, lfoHz:.05,  lfoAmp:260,  forma:"triangle" },
    noche:  { tipo:"tono", raiz:65.41,  arm:[1,1.5,2],     corte:360,  Q:.6, lfoHz:.028, lfoAmp:90,   forma:"sine" },
    eter:   { tipo:"tono", raiz:146.83, arm:[1,2,3,4.5],   corte:1500, Q:.5, lfoHz:.035, lfoAmp:420,  forma:"sine" },
    lluvia: { tipo:"ruido", corte:5200, Q:.4, hp:900, lfoHz:.12, lfoAmp:1500, swell:false },
    oceano: { tipo:"ruido", corte:680,  Q:.5, hp:110, lfoHz:.06, lfoAmp:220,  swell:true },
    concentracion: { tipo:"tono", raiz:98, arm:[1,2,3], corte:680, Q:.5, lfoHz:.018, lfoAmp:110, forma:"sine" },
    marron: { tipo:"ruido", marron:true, corte:1400, Q:.3, hp:20, lfoHz:.04, lfoAmp:180, swell:false },
    blanco: { tipo:"ruido", corte:9000, Q:.2, hp:180, lfoHz:.06, lfoAmp:700, swell:false },
    binaural: { tipo:"binaural", base:180, beat:12, vol:.5 }
  };
  // Un solo AudioContext, reutilizado y nunca cerrado: iOS limita a ~4 contextos.
  function contexto(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{ ctx = new AC(); }catch(e){ return null; }
    }
    return ctx;
  }
  // Desbloqueo iOS: resume + un buffer silencioso, dentro de un gesto del usuario.
  function desbloquear(){
    const c = contexto(); if(!c) return;
    try{ c.resume(); }catch(e){}
    if(!desbloqueado){
      try{
        const b = c.createBuffer(1, 1, c.sampleRate);
        const s = c.createBufferSource(); s.buffer = b; s.connect(c.destination); s.start(0);
        desbloqueado = true;
      }catch(e){}
    }
  }
  function iniciar(escena, vol){
    try{
      detener(0);
      const c = contexto(); if(!c) return false;
      try{ c.resume(); }catch(e){}
      const p = PRESETS[escena] || PRESETS.vela;
      master = c.createGain(); master.gain.value = 0; master.connect(c.destination);

      if(p.tipo === "ruido"){
        const sr = c.sampleRate, buf = c.createBuffer(1, sr*3, sr), d = buf.getChannelData(0);
        if(p.marron){
          let ult = 0;
          for(let i=0;i<d.length;i++){ const w = Math.random()*2-1; ult = (ult + 0.02*w)/1.02; d[i] = ult*3; }
        } else {
          for(let i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
        }
        const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
        const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = p.hp;
        const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = p.corte; lp.Q.value = p.Q;
        src.connect(hp); hp.connect(lp);
        let salida = lp;
        if(p.swell){
          const swellG = c.createGain(); swellG.gain.value = .7;
          lp.connect(swellG); salida = swellG;
          const s = c.createOscillator(); s.frequency.value = .07;
          const sg = c.createGain(); sg.gain.value = .3;
          s.connect(sg); sg.connect(swellG.gain); s.start(); moduladores.push(s);
        }
        salida.connect(master);
        const lfo = c.createOscillator(); lfo.frequency.value = p.lfoHz;
        const lg = c.createGain(); lg.gain.value = p.lfoAmp;
        lfo.connect(lg); lg.connect(lp.frequency); lfo.start(); moduladores.push(lfo);
        src.start(); fuentes.push(src);
      } else if(p.tipo === "binaural"){
        const mk = (freq, pan)=>{
          const o = c.createOscillator(); o.type = "sine"; o.frequency.value = freq;
          const g = c.createGain(); g.gain.value = (p.vol || .5);
          o.connect(g);
          if(c.createStereoPanner){ const pn = c.createStereoPanner(); pn.pan.value = pan; g.connect(pn); pn.connect(master); }
          else { g.connect(master); }
          o.start(); fuentes.push(o);
        };
        mk(p.base, -1);
        mk(p.base + p.beat, 1);
      } else {
        const filtro = c.createBiquadFilter(); filtro.type = "lowpass";
        filtro.frequency.value = p.corte; filtro.Q.value = p.Q; filtro.connect(master);
        const lfo = c.createOscillator(); lfo.frequency.value = p.lfoHz;
        const lg = c.createGain(); lg.gain.value = p.lfoAmp;
        lfo.connect(lg); lg.connect(filtro.frequency); lfo.start(); moduladores.push(lfo);
        // segunda modulación lenta para que respire (evolución tipo Endel)
        const drift = c.createOscillator(); drift.frequency.value = p.lfoHz*0.37 + .011;
        const dg = c.createGain(); dg.gain.value = p.lfoAmp*0.45;
        drift.connect(dg); dg.connect(filtro.frequency); drift.start(); moduladores.push(drift);
        p.arm.forEach((m,i)=>{
          const o = c.createOscillator(); o.type = p.forma;
          o.frequency.value = p.raiz*m; o.detune.value = (i%2?1:-1)*(4+i*3);
          const g = c.createGain(); g.gain.value = .32/(i+1);
          o.connect(g); g.connect(filtro); o.start(); fuentes.push(o);
        });
      }

      // Entrada audible y rápida (antes: tope .09 subiendo en 8 s → casi inaudible).
      master.gain.linearRampToValueAtTime(Math.max(.002, vol*.20), c.currentTime + 3);
      vivo = true; return true;
    }catch(e){ return false; }
  }
  function volumen(v){ if(vivo&&master&&ctx) try{ master.gain.linearRampToValueAtTime(Math.max(.0001,v*.20), ctx.currentTime+.4); }catch(e){} }
  function detener(seg){
    if(!vivo||!ctx){ vivo=false; return; }
    const s = (seg===undefined?4:seg);
    try{
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
      master.gain.linearRampToValueAtTime(.0001, ctx.currentTime + Math.max(.05,s));
    }catch(e){}
    const f = fuentes, m = moduladores, mst = master; vivo=false;
    // Detenemos y desconectamos nodos, pero NO cerramos el contexto (se reutiliza).
    setTimeout(()=>{
      try{ f.forEach(x=>{ try{ x.stop(); x.disconnect(); }catch(_){} }); }catch(e){}
      try{ m.forEach(x=>{ try{ x.stop(); x.disconnect(); }catch(_){} }); }catch(e){}
      try{ if(mst) mst.disconnect(); }catch(e){}
    }, s*1000+400);
    fuentes=[]; moduladores=[]; master=null;
  }
  function campana(){
    try{
      const c = contexto(); if(!c) return; try{ c.resume(); }catch(e){}
      const t = c.currentTime;
      [880, 1318.5].forEach((f,i)=>{
        const o = c.createOscillator(); o.type = "sine"; o.frequency.value = f;
        const g = c.createGain();
        g.gain.setValueAtTime(0, t + i*0.18);
        g.gain.linearRampToValueAtTime(0.14, t + i*0.18 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.18 + 0.6);
        o.connect(g); g.connect(c.destination);
        o.start(t + i*0.18); o.stop(t + i*0.18 + 0.65);
      });
    }catch(e){}
  }
  return { iniciar, detener, volumen, activo:()=>vivo, desbloquear, campana };
})();

  let voces = [];
  function refrescar(){ if(soporte) voces = speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)); }
  if(soporte){ refrescar(); speechSynthesis.onvoiceschanged = refrescar; }
  function mejor(v){ return /(enhanced|premium|neural|natural|siri|realistic)/i.test(v.name||"") || /google/i.test(v.name||""); }
  function puntua(v){
    const n = v.name||"", l = v.lang||""; let s = 0;
    if(/-?MX/i.test(l)) s += 40; else if(/-?(US|419)/i.test(l)) s += 14; else if(/-?ES/i.test(l)) s += 8;
    if(/(enhanced|premium|neural|natural|siri|realistic)/i.test(n)) s += 34;
    if(/google/i.test(n)) s += 22;
    if(/(paulina|angélica|angelica|juan|jorge|mónica|monica|dalia)/i.test(n)) s += 10;
    if(v.localService) s += 4;
    return s;
  }
  function ordenadas(){ return voces.slice().sort((a,b)=>puntua(b)-puntua(a)); }
  function elegir(){
    if(!voces.length) refrescar();
    if(E.ajustes.vozNombre){ const v = voces.find(x=>x.name===E.ajustes.vozNombre); if(v) return v; }
    return ordenadas()[0] || null;
  }
  function hablar(texto, alTerminar){
    if(!soporte || !P.vozOn){ alTerminar(false); return; }
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(texto);
      const v = elegir(); if(v){ u.voice = v; u.lang = v.lang; } else { u.lang = "es-MX"; }
      u.rate = Math.min(1.3, Math.max(.5, E.ajustes.ritmo * (E.ajustes.velocidad||1))); u.pitch = 1; u.volume = 1;
      let listo = false;
      const fin = ()=>{ if(listo) return; listo = true; alTerminar(true); };
      u.onend = fin; u.onerror = ()=>{ if(listo) return; listo=true; alTerminar(false); };
      speechSynthesis.speak(u);
      setTimeout(()=>{ if(!listo && !speechSynthesis.speaking) fin(); }, 700);
    }catch(e){ alTerminar(false); }
  }
  function callar(){ if(soporte) try{ speechSynthesis.cancel(); }catch(e){} }
  return { soporte, hablar, callar, lista:()=>ordenadas(), mejor };
})();

/* ════════════════ REPRODUCTOR DE PRÁCTICA ════════════════ */
const $ = s => document.querySelector(s);
const P = {
  rito:null, plan:[], i:0, corriendo:false, esperando:false,
  t0:0, acumulado:0, objetivo:0, raf:null, inicioSesion:0,
  dormirId:null, modoAudio:false, wake:null, vozOn:true, ambOn:true, med:null
};

function aplanar(rito){
  const plan = [];
  rito.bloques.forEach((b, bi)=>{
    const lineas = b.dinamico ? b.dinamico() : b.lineas;
    lineas.forEach((l, li)=>{
      const o = (typeof l === "string") ? { t:l } : Object.assign({}, l);
      o.bloque = b; o.bi = bi; o.primera = (li===0);
      plan.push(o);
    });
  });
  return plan;
}
function duracion(o){
  if(o.hold) return o.hold;
  const n = (o.t||"").split(/\s+/).filter(Boolean).length;
  return Math.max(2600, n*430) + E.ajustes.pausa;
}

function abrirRitual(id){
  const r = RITUALES[id]; if(!r) return;
  P.rito = r; P.plan = aplanar(r); P.i = 0; P.modoAudio = false;
  P.inicioSesion = Date.now();
  P.vozOn = vozDe(r.id); P.ambOn = ambDe(r.id);
  document.body.classList.toggle("tema-noche", r.tema === "noche");
  document.body.classList.add("encendida");
  $("#inicio").classList.add("oculto");
  $("#practica").classList.remove("oculto");
  $("#pDormir").classList.toggle("oculto", r.tema !== "noche");
  $("#pAudioLista").classList.add("oculto");
  $("#pCentro").classList.remove("oculto");
  const url = (E.ajustes.urlAudio||{})[id] || "";
  if(url){ pintarControles(); modoGrabacion(url); return; }
  if(P.ambOn) Pad.iniciar(escenaActiva(r.tema), E.ajustes.padVol);
  else Pad.detener(1.5);
  padBed = false;
  pedirPantalla();
  if(r.tema === "noche" && E.ajustes.dormir) programarDormir();
  P.corriendo = true;
  pintarControles();
  mostrar();
}

function mostrar(){
  P.objetivo = 0; P.acumulado = 0;
  const o = P.plan[P.i];
  if(!o){ terminar(); return; }
  $("#pMov").textContent = o.bloque.num + " · " + o.bloque.nom.toUpperCase();
  $("#pBloque").textContent = o.primera && o.bloque.rub ? o.bloque.rub : "";
  const nota = $("#pNota");
  if(o.nota){ nota.textContent = o.nota; nota.classList.remove("oculto"); }
  else nota.classList.add("oculto");

  if(o.respiro){ respirar(o.respiro); return; }
  $("#pRespiro").classList.add("oculto");
  const el = $("#pLinea");
  el.classList.remove("oculto");
  el.textContent = o.t;
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  pintar();
  if(!P.corriendo) return;
  Voz.hablar(o.t, ()=>{
    if(!P.corriendo) return;
    const base = (P.vozOn && Voz.soporte) ? E.ajustes.pausa : duracion(o);
    esperar(o.hold ? Math.max(o.hold, base) : base);
  });
}

function esperar(ms){
  P.objetivo = ms; P.acumulado = 0; P.t0 = performance.now();
  cancelAnimationFrame(P.raf);
  const paso = (t)=>{
    if(!P.corriendo) return;
    const transcurrido = P.acumulado + (t - P.t0);
    pintar(Math.min(1, transcurrido/P.objetivo));
    if(transcurrido >= P.objetivo){ P.i++; mostrar(); return; }
    P.raf = requestAnimationFrame(paso);
  };
  P.raf = requestAnimationFrame(paso);
}

function respirar(veces){
  P.objetivo = 0; P.acumulado = 0;
  cancelAnimationFrame(P.raf);
  $("#pLinea").classList.add("oculto");
  $("#pRespiro").classList.remove("oculto");
  const aro = $("#respiroAro"), txt = $("#respiroTxt");
  const miIndice = P.i;
  let n = 0;
  const vigente = () => P.corriendo && P.i === miIndice;
  const ciclo = ()=>{
    if(!vigente()) return;
    if(n >= veces){
      $("#pRespiro").classList.add("oculto");
      $("#pLinea").classList.remove("oculto");
      aro.classList.remove("dentro");
      P.i++; mostrar(); return;
    }
    n++;
    txt.textContent = "Inhala"; aro.classList.add("dentro");
    pintar(n/veces);
    setTimeout(()=>{ if(vigente()) txt.textContent = "Sostén"; }, 4000);
    setTimeout(()=>{ if(vigente()){ txt.textContent = "Exhala"; aro.classList.remove("dentro"); } }, 5000);
    setTimeout(ciclo, 11000);
  };
  ciclo();
}

const NODO = {};
function nodos(){
  NODO.quemada = $("#velaQuemada"); NODO.llama = $("#velaLlama");
  NODO.prog = $("#pProgreso");      NODO.tiempo = $("#pTiempo");
}
let ultimoPct = -1, ultimoSeg = -1;
function pintar(frac){
  const total = P.plan.length || 1;
  const p = Math.min(1, (P.i + (frac||0)) / total);
  const pct = (p*100);
  NODO.quemada.style.height = pct.toFixed(2) + "%";
  NODO.llama.style.top = pct.toFixed(2) + "%";
  const r = Math.round(pct);
  if(r !== ultimoPct){ NODO.prog.textContent = r + " %"; ultimoPct = r; }
  const s = Math.floor((Date.now()-P.inicioSesion)/1000);
  if(s !== ultimoSeg){ NODO.tiempo.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); ultimoSeg = s; }
}

function alternarPlay(){
  if(P.modoAudio){
    const a = $("#reproductor");
    if(a.paused){ a.play(); $("#pPlay").textContent = "Pausar"; }
    else { a.pause(); $("#pPlay").textContent = "Continuar"; }
    return;
  }
  if(P.corriendo){
    P.corriendo = false;
    if(P.objetivo > 0) P.acumulado += performance.now() - P.t0;
    cancelAnimationFrame(P.raf); Voz.callar();
    $("#pPlay").textContent = "Continuar";
  } else {
    P.corriendo = true; $("#pPlay").textContent = "Pausar";
    const resto = P.objetivo - P.acumulado;
    if(P.objetivo > 0 && resto > 120) esperar(resto);
    else { P.objetivo = 0; P.acumulado = 0; mostrar(); }
  }
}
function saltar(d){
  if(P.modoAudio){ $("#reproductor").currentTime += d*15; return; }
  cancelAnimationFrame(P.raf); Voz.callar();
  const siguiente = P.i + d;
  if(siguiente >= P.plan.length){ P.i = P.plan.length; terminar(); return; }
  P.i = Math.max(0, siguiente);
  P.acumulado = 0; P.objetivo = 0;
  if(!P.corriendo){ P.corriendo = true; $("#pPlay").textContent = "Pausar"; }
  mostrar();
}

function terminar(){
  const id = P.rito ? P.rito.id : null;
  if(id){
    const d = hoyISO();
    E.dias[d] = E.dias[d] || {am:false,pm:false};
    if(id === "noche") E.dias[d].pm = true; else E.dias[d].am = true;
    guardar();
  }
  $("#velaQuemada").style.height = "100%";
  $("#velaLlama").style.top = "100%";
  $("#pMov").textContent = "";
  $("#pBloque").textContent = "";
  $("#pRespiro").classList.add("oculto");
  const el = $("#pLinea"); el.classList.remove("oculto");
  el.textContent = P.med ? "…" : (P.rito && P.rito.tema === "noche" ? "Buenas noches." : "Amén.");
  $("#pNota").classList.add("oculto");
  $("#pPlay").textContent = "Terminar";
  P.corriendo = false;
  if(P.rito && P.rito.tema === "noche" && Pad.activo()){
    $("#pPlay").textContent = "Silencio";
  } else {
    setTimeout(()=>{ if(!P.corriendo) cerrarPractica(); }, 4500);
  }
}

function cerrarPractica(){
  P.corriendo = false; P.modoAudio = false; P.med = null;
  cancelAnimationFrame(P.raf); Voz.callar(); Pad.detener(2.5);
  clearTimeout(P.dormirId);
  const a = $("#reproductor"); try{ a.pause(); a.removeAttribute("src"); a.load(); }catch(e){}
  soltarPantalla();
  document.body.classList.remove("encendida","tema-noche");
  $("#velaQuemada").style.height = "0%"; $("#velaLlama").style.top = "0%";
  $("#practica").classList.add("oculto");
  $("#inicio").classList.remove("oculto");
  $("#pPlay").textContent = "Pausar";
  render();
  ambienteBed();
}

function programarDormir(){
  clearTimeout(P.dormirId);
  const min = E.ajustes.dormir;
  if(!min) return;
  P.dormirId = setTimeout(()=>{
    Voz.callar(); P.corriendo = false; cancelAnimationFrame(P.raf);
    Pad.detener(40);
    const a = $("#reproductor"); if(!a.paused){ let v=a.volume; const f=setInterval(()=>{ v-=.03; if(v<=0){ a.pause(); clearInterval(f);} else a.volume=Math.max(0,v); },1200); }
    $("#pLinea").textContent = "";
    $("#pBloque").textContent = "";
    $("#pMov").textContent = "";
    setTimeout(cerrarPractica, 45000);
  }, min*60000);
}

function montarAudio(url){
  const a = $("#reproductor");
  a.src = url; a.volume = 1;
  try{ a.preservesPitch = true; a.mozPreservesPitch = true; a.webkitPreservesPitch = true; }catch(e){}
  let cargado = false;
  const falla = ()=>{
    if(cargado) return; cargado = true; clearTimeout(tiempoMax);
    $("#pAudioLista").classList.add("oculto");
    $("#pCentro").classList.remove("oculto");
    $("#pLinea").textContent = "No se pudo cargar el audio.";
    P.modoAudio = false;
  };
  const tiempoMax = setTimeout(falla, 15000);
  a.onloadedmetadata = ()=>{
    cargado = true; clearTimeout(tiempoMax);
    try{ a.playbackRate = E.ajustes.velocidad || 1; }catch(e){}
    a.play().catch(()=>{ $("#pPlay").textContent = "Reproducir"; });
  };
  a.ontimeupdate = ()=>{
    const p = a.duration ? a.currentTime/a.duration : 0;
    $("#velaQuemada").style.height = (p*100).toFixed(2)+"%";
    $("#velaLlama").style.top = (p*100).toFixed(2)+"%";
    $("#pProgreso").textContent = Math.round(p*100)+" %";
    const s = Math.floor(a.currentTime);
    $("#pTiempo").textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  };
  a.onended = terminar;
  a.onerror = falla;
}

function modoGrabacion(url){
  P.modoAudio = true;
  $("#pCentro").classList.add("oculto");
  const cont = $("#pAudioLista"); cont.innerHTML = "";
  P.rito.bloques.forEach(b=>{
    const lineas = b.dinamico ? b.dinamico() : b.lineas;
    const d = document.createElement("div"); d.className = "audio-bloque";
    d.innerHTML = '<p class="rubrica">' + b.num + " · " + b.nom + "</p>";
    lineas.forEach(l=>{
      const t = (typeof l === "string") ? l : (l.t || (l.respiro ? "· respiración ·" : ""));
      if(!t) return;
      const p = document.createElement("p"); p.className = "audio-linea"; p.textContent = t; d.appendChild(p);
    });
    cont.appendChild(d);
  });
  cont.classList.remove("oculto");
  montarAudio(url);
  pedirPantalla();
  pintarControles();
  if(P.rito.tema === "noche" && E.ajustes.dormir) programarDormir();
}

function reproducirMeditacion(med){
  cerrarHoja();
  P.rito = null; P.med = med; P.plan = []; P.modoAudio = true;
  P.inicioSesion = Date.now();
  document.body.classList.add("encendida");
  document.body.classList.remove("tema-noche");
  $("#inicio").classList.add("oculto");
  $("#practica").classList.remove("oculto");
  $("#pDormir").classList.add("oculto");
  $("#pMov").textContent = med.titulo;
  $("#pCentro").classList.add("oculto");
  const cont = $("#pAudioLista"); cont.innerHTML = "";
  const d = document.createElement("div"); d.className = "audio-bloque";
  d.innerHTML = '<p class="rubrica">' + esc(med.titulo) + '</p>';
  med.texto.split("\n").forEach(linea=>{
    const t = linea.trim(); if(!t) return;
    const p = document.createElement("p"); p.className = "audio-linea"; p.textContent = t; d.appendChild(p);
  });
  cont.appendChild(d);
  cont.classList.remove("oculto");
  P.vozOn = false; P.ambOn = E.ajustes.pad;

  else Pad.detener(1.5);
  padBed = false;
  pedirPantalla();
  pintarControles();
}

async function pedirPantalla(){
  try{ if("wakeLock" in navigator) P.wake = await navigator.wakeLock.request("screen"); }catch(e){}
}
function soltarPantalla(){ try{ if(P.wake){ P.wake.release(); P.wake = null; } }catch(e){} }

/* ════════════════ INICIO ════════════════ */
function racha(){
  const clave = dd => dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
  const hecho = dd => { const r = E.dias[clave(dd)]; return !!(r && (r.am || r.pm)); };
  const d = new Date();
  if(!hecho(d)) d.setDate(d.getDate()-1);   // el día aún no termina: no rompe la racha
  let n = 0;
  for(let k=0;k<400 && hecho(d);k++){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function render(){
  const ahora = new Date(), h = ahora.getHours();
  const nom = (E.ajustes.nombre || "").trim();
  const coma = nom ? ", " + nom : "";
  $("#saludo").textContent = (h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches") + coma;
  const _hoy = $("#hoyTxt"); if(_hoy){ const _m = mensajesActivos(); _hoy.textContent = _m[Math.floor(Date.now()/86400000) % _m.length]; }
  $("#rubricaHora").textContent = h < 12 ? "Activación" : h < 19 ? "En medio del día" : "Rendición";
  $("#fecha").textContent = DIAS_L[ahora.getDay()] + " " + ahora.getDate() + " de " + MESES_L[ahora.getMonth()] + " · " + String(ahora.getHours()).padStart(2,"0")+":"+String(ahora.getMinutes()).padStart(2,"0");

  const n = racha();
  $("#rachaN").textContent = n;
  $("#rachaT").textContent = n === 1 ? "día seguido" : "días seguidos";
  const hoy = E.dias[hoyISO()] || {};
  $("#marcaAM").classList.toggle("hecho", !!hoy.am);
  $("#marcaPM").classList.toggle("hecho", !!hoy.pm);

  const sug = h < 12 ? "manana" : h < 19 ? "nucleo" : "noche";
  const cont = $("#ritos"); cont.innerHTML = "";
  ["manana","noche","nucleo"].forEach(id=>{
    const r = RITUALES[id];
    const b = document.createElement("button");
    b.className = "rito" + (id === sug ? " sugerido" : "");
    b.innerHTML =
      '<span class="rito-num">' + r.bloques.map(x=>x.num).join(" · ") + '</span>' +
      '<span class="rito-alto"><span class="rito-nom">' + r.nombre + '</span>' +
      '<span class="rito-dur">' + r.dur + '</span></span>' +
      '<span class="rito-sub">' + r.sub + '</span>';
    b.addEventListener("click", ()=>abrirRitual(id));
    cont.appendChild(b);
  });

  const av = $("#avisoVision");
  const v = E.vision;
  if(!v.ser && !v.hacer && !v.tener){
    av.innerHTML = '<b>El bloque Visión sigue vacío.</b> Tienes el método escrito pero no la respuesta. Ser · Hacer · Tener, tres líneas.';
    av.classList.remove("oculto");
  } else if(v.fecha && (Date.now() - v.fecha) > 90*86400000){
    const d = Math.floor((Date.now()-v.fecha)/86400000);
    av.innerHTML = '<b>Toca revisar la Visión.</b> Última actualización hace ' + d + ' días. El acuerdo era cada trimestre.';
    av.classList.remove("oculto");
  } else av.classList.add("oculto");
}

    '<p class="campo-ayuda">Si una línea se siente falsa al decirla, no la suavices — acompáñala con un compromiso de proceso. «Yo soy el mejor inversionista» aterriza mejor seguido de «y por eso mi stop-loss es sagrado».</p>' +
    '<div class="acciones"><button class="accion" id="vCancel">Cancelar</button><button class="accion llena" id="vGuardar">Guardar</button></div>',

/* ════════════════ REGISTRO (journal + check-ins) ════════════════ */
function capit(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function fechaLegible(d){ return capit(DIAS_L[d.getDay()]) + " " + d.getDate() + " de " + MESES_L[d.getMonth()]; }
function fechaCorta(iso){ const p = iso.split("-"); return (+p[2]) + " " + (MESES_L[(+p[1])-1] || ""); }
function campoArea(id, label, val, ph){
  return '<div class="campo"><label class="campo-et" for="'+id+'">'+label+'</label>' +
    '<textarea class="campo-area" id="'+id+'" placeholder="'+esc(ph||"")+'">'+esc(val||"")+'</textarea></div>';
}
let guardadoT = null;
function marcarGuardado(){
  const el = $("#regGuardado"); if(!el) return;
  el.textContent = "Guardado"; el.style.opacity = "1";
  clearTimeout(guardadoT); guardadoT = setTimeout(()=>{ if($("#regGuardado")) $("#regGuardado").style.opacity = "0"; }, 1400);
}
function historialDiario(){
  const R = E.registro, hoy = hoyISO();
  const fechas = Object.keys(R.diario).filter(f=>f!==hoy && (R.diario[f].logre||R.diario[f].gratitud||R.diario[f].prioridad)).sort().reverse().slice(0,14);
  if(!fechas.length) return '';
  return '<div class="reg-hist"><p class="reg-hist-t">Días anteriores</p>' +
    fechas.map(f=>{ const e = R.diario[f]; const prev = (e.logre || e.gratitud || e.prioridad || "").slice(0,120); return '<div class="reg-item"><div class="reg-item-f">'+fechaCorta(f)+'</div><div class="reg-item-p">'+esc(prev)+'</div></div>'; }).join("") +
    '</div>';
}
function historialJournal(){
  const J = E.registro.journal, hoy = hoyISO();
  const fechas = Object.keys(J).filter(f=>f!==hoy && (J[f]||"").trim()).sort().reverse().slice(0,20);
  if(!fechas.length) return '<p class="reg-vacio">Aún no hay entradas anteriores. Esta es la primera.</p>';
  return '<div class="reg-hist"><p class="reg-hist-t">Entradas anteriores</p>' +
    fechas.map(f=>'<div class="reg-item"><div class="reg-item-f">'+fechaCorta(f)+'</div><div class="reg-item-p">'+esc(J[f].slice(0,140))+'</div></div>').join("") +
    '</div>';
}
function renderCadencia(cad, cont){
  const R = E.registro;
  if(cad === "diario"){
    const hoy = hoyISO();
    const dd = R.diario[hoy] || { logre:"", gratitud:"", prioridad:"" };
    cont.innerHTML =
      '<p class="cad-fecha">'+fechaLegible(new Date())+'</p>' +
      campoArea("dLogre","¿Qué logré hoy?", dd.logre, "Lo que moviste, aunque sea pequeño.") +
      campoArea("dGrat","¿Por qué estoy agradecido?", dd.gratitud, "Concreto de este día, no genérico.") +
      campoArea("dPrio","¿Cuál es la primera prioridad de mañana?", dd.prioridad, "Una sola. La que abre el día.") +
      '<div class="reg-guardado" id="regGuardado"></div>' +
      historialDiario();
    const bind = (sel, campo)=>{ const el = $(sel); if(!el) return; el.addEventListener("input", e=>{ R.diario[hoy] = R.diario[hoy] || {}; R.diario[hoy][campo] = e.target.value; marcarGuardado(); guardar(); }); };
    bind("#dLogre","logre"); bind("#dGrat","gratitud"); bind("#dPrio","prioridad");
  } else if(cad === "semanal"){
    const sem = semanaISO();
    const sd = R.semanal[sem] || { marcas:[false,false,false,false], nota:"" };
    if(!Array.isArray(sd.marcas)) sd.marcas = [false,false,false,false];
    R.semanal[sem] = sd;
    cont.innerHTML =
      '<p class="cad-fecha">Semana '+sem.replace("-S"," · ")+' — se reinicia cada lunes</p>' +
      ARQUITECTO.map((t,i)=>'<button class="check'+(sd.marcas[i]?' on':'')+'" data-i="'+i+'"><span class="check-caja">✓</span><span class="check-txt"><span class="check-n">'+(i+1)+'</span>'+t+'</span></button>').join("") +
      '<div class="veredicto" id="aVeredicto"></div>' +
      campoArea("sNota","Nota de la semana", sd.nota, "¿Dónde falló el foco? ¿Qué patrón viste?");
    const pintarV = ()=>{
      const n = sd.marcas.filter(Boolean).length;
      $("#aVeredicto").textContent = n===4 ? "Los cuatro activos. Expansión inevitable."
        : n===3 ? "Uno falla. Ahí es donde entran las dudas."
        : n===2 ? "Dos fallan. Eso es estancamiento."
        : n===1 ? "Tres fallan. Nada se sostiene desde aquí."
        : "Ninguno activo. Empieza por el 1.";
    };
    pintarV();
    document.querySelectorAll("#cadCont .check").forEach(b=>{
      b.addEventListener("click", ()=>{ const i=+b.dataset.i; sd.marcas[i]=!sd.marcas[i]; b.classList.toggle("on",sd.marcas[i]); guardar(); pintarV(); });
    });
    $("#sNota").addEventListener("input", e=>{ sd.nota = e.target.value; guardar(); });
  } else {
    const mes = mesISO(), ahora = new Date();
    let md = R.mensual[mes];
    if(!md){ md = { hitos: MENSUAL_HITOS.map(t=>({t:t, ok:false})), reflexion:"" }; R.mensual[mes] = md; }
    if(!Array.isArray(md.hitos)) md.hitos = MENSUAL_HITOS.map(t=>({t:t, ok:false}));
    cont.innerHTML =
      '<p class="cad-fecha">'+capit(MESES_L[ahora.getMonth()])+" "+ahora.getFullYear()+' — hitos del mes</p>' +
      '<div class="campo"><label class="campo-et">Hitos</label>' +
        md.hitos.map((h,i)=>'<div class="hito'+(h.ok?' on':'')+'" data-i="'+i+'"><span class="hito-caja">✓</span><input class="hito-in" data-i="'+i+'" value="'+esc(h.t)+'"></div>').join("") +
        '<p class="campo-ayuda">Edita cada hito para el mes. Tócalo para marcarlo cumplido.</p></div>' +
      campoArea("mRef","Reflexión del mes", md.reflexion, "¿Qué construí? ¿Qué patrón quiero cambiar?");
    document.querySelectorAll("#cadCont .hito-caja").forEach(cja=>{
      const fila = cja.closest(".hito"), i = +fila.dataset.i;
      cja.addEventListener("click", ()=>{ md.hitos[i].ok = !md.hitos[i].ok; fila.classList.toggle("on", md.hitos[i].ok); guardar(); });
    });
    document.querySelectorAll("#cadCont .hito-in").forEach(inp=>{
      inp.addEventListener("input", ()=>{ md.hitos[+inp.dataset.i].t = inp.value; guardar(); });
    });
    $("#mRef").addEventListener("input", e=>{ md.reflexion = e.target.value; guardar(); });
  }
}
